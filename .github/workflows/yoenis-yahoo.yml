# Pulls the Wipe Yoenis season from Yahoo into tools/yahoo_yoenis/<year>.json, then checks the 2027
# keeper costs on davidsolar.dev/yoenis/ against it (tools/yoenis_keeper_check.py).
# Also pulls the category race into yoenis/race.json (tools/yoenis_race_pull.py).
# Runs Monday mornings in the offseason, twice a day in season, when the scripts change, or by hand.
name: Wipe Yoenis Yahoo pull

on:
  push:
    branches: [main]
    paths:
      - tools/yoenis_yahoo_pull.py
      - tools/yoenis_keeper_check.py
      - tools/yoenis_trades_pull.py
      - tools/yoenis_trades_build.py
      - tools/yoenis_race_pull.py
      - tools/yoenis_history_pull.py
      - tools/yoenis_history_build.py
      - .github/workflows/yoenis-yahoo.yml
  schedule:
    - cron: "23 14 * 10-12,1-3 1"   # 10:23am ET Mondays, October through March
    - cron: "43 14 * 4-9 *"           # in season: 10:43am ET every day, April through September
    - cron: "43 3 * 4-10 *"           # and 11:43pm ET, after the night games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yoenis-yahoo
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull the season from Yahoo
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          python3 tools/yoenis_yahoo_pull.py
          python3 tools/yoenis_trades_pull.py
          python3 tools/yoenis_race_pull.py
          python3 tools/yoenis_history_pull.py

      - name: Check the 2027 keeper costs
        run: |
          if [ -f tools/yoenis_keeper_check.py ]; then python3 tools/yoenis_keeper_check.py; fi

      - name: Build the trade history
        run: |
          if [ -f tools/yoenis_trades_build.py ]; then python3 tools/yoenis_trades_build.py; fi
          if [ -f tools/yoenis_history_build.py ]; then python3 tools/yoenis_history_build.py; fi

      - name: Commit
        run: |
          git add tools/yahoo_yoenis yoenis/data.json yoenis/race.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Wipe Yoenis: Yahoo pull"
          git pull --rebase -q origin main
          git push
