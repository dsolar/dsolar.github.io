name: probe gamelog (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          p() { echo "=== $1"; curl -s -D h.txt -o b.json -H "Origin: https://davidsolar.dev" "$1"; grep -i "^HTTP\|access-control-allow-origin" h.txt; head -c 1200 b.json; echo; }
          p "https://site.web.api.espn.com/apis/common/v3/search?query=Connor%20McDavid&type=player&limit=5"
          p "https://site.web.api.espn.com/apis/search/v2?query=Aaron%20Judge&limit=5"
          p "https://statsapi.mlb.com/api/v1/people/592450/stats?stats=gameLog&season=2026&group=hitting"
          p "https://api-web.nhle.com/v1/player/8478402/game-log/now"
          p "https://site.web.api.espn.com/apis/common/v3/sports/basketball/mens-college-basketball/athletes/5325990/gamelog"
          python3 -c "
          import json; d=json.load(open('b.json')); ev=d.get('events',{}); k=list(ev)[:1]
          e=ev[k[0]] if k else {}; e.pop('links',None); print('CBB EVENT', json.dumps(e)[:900])"
