# NBA future picks for the NBA Hub and Big Board. RealGM refuses GitHub's servers, so tools/nba_picks_pull.js runs in a
# browser on RealGM's detailed future-picks page and drops the tables in Supabase; this job saves the latest drop
# (tools/nba_picks_raw.json) and rebuilds the pick ledger in tools/draft_future.json.
# The browser pull runs Mondays with the Big Board weekly check (8:37am ET); this runs daily at 9:23am ET and changes
# nothing when the drop hasn't. It turns red when RealGM rewords a pick that tools/nba_picks_overrides.json models by hand.
name: NBA future picks

on:
  schedule:
    - cron: "23 14 * * *"
  push:
    branches: [main]
    paths:
      - tools/nba_picks.py
      - tools/nba_picks_parse.py
      - .github/workflows/nba-picks.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-picks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save the latest RealGM drop
        run: python3 tools/nba_picks.py
      - name: Rebuild the ledger
        run: rm -f /tmp/nba_picks_warn.txt; cd tools && python3 nba_picks.py --build
      - name: Commit it
        run: |
          git add tools/nba_picks_raw.json tools/draft_future.json tools/nba_picks_overrides.json draft/nba.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Update NBA future picks from RealGM"
          for i in 1 2 3 4 5; do (git pull --rebase -X theirs -q || { git rebase --abort; false; }) && git push && break; [ $i = 5 ] && exit 1; sleep $((i * 8)); done
      - name: Check the hand-modeled picks
        run: if [ -s /tmp/nba_picks_warn.txt ]; then cat /tmp/nba_picks_warn.txt; exit 1; fi
