name: probe images (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          check() { c=$(curl -s -o /dev/null -I -m 20 -A 'Mozilla/5.0' -w '%{http_code} %{size_download}' "$1"); l=$(curl -sI -m 20 -A 'Mozilla/5.0' "$1" | grep -i '^content-length' | tr -d '\r' | awk '{print $2}' | tail -1); echo "$c $l $1"; }
          export -f check
          xargs -P 24 -I{} bash -c 'check "{}"' < tools/_probe_urls.txt > /tmp/r.txt
          echo "TOTAL $(wc -l < /tmp/r.txt)"
          awk '{print $1}' /tmp/r.txt | sort | uniq -c
          grep -v '^200 ' /tmp/r.txt | head -150 | sed 's/^/BAD /'
          grep '^200 ' /tmp/r.txt | awk '{print $3}' | sort | uniq -c | sort -rn | head -5 | sed 's/^/SIZE /'
