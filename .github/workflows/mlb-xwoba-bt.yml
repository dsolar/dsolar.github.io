name: MLB xwOBA backtest (temporary)
on: workflow_dispatch
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - run: pip install numpy -q
      - name: Backtest
        run: |
          python3 - <<'PY'
          import csv, io, urllib.request, numpy as np
          def get(kind, y):
              u = f"https://baseballsavant.mlb.com/leaderboard/expected_statistics?type={kind}&year={y}&position=&team=&filterType=pa&min=100&csv=true"
              t = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf-8-sig")
              return {r["player_id"]: r for r in csv.DictReader(io.StringIO(t))}
          for kind, act, exp, lo in (("batter", "woba", "est_woba", 300), ("pitcher", "woba", "est_woba", 300)):
              D = {y: get(kind, y) for y in range(2018, 2027)}
              rows = []
              for y in range(2018, 2026):
                  for pid, a in D[y].items():
                      b = D[y + 1].get(pid)
                      if not b: continue
                      try: pa, pb = float(a["pa"]), float(b["pa"]); wa, xa, wb = float(a[act]), float(a[exp]), float(b[act])
                      except Exception: continue
                      if pa >= lo and pb >= lo: rows.append((y, wa, xa, wb, pb))
              yrs = sorted({r[0] for r in rows}); out = {}
              for name, cols in (("wOBA", [1]), ("xwOBA", [2]), ("both", [1, 2])):
                  err, ys = [], []
                  for h in yrs:
                      tr = [r for r in rows if r[0] != h]; te = [r for r in rows if r[0] == h]
                      X = lambda rs: np.array([[1] + [r[c] for c in cols] for r in rs]); W = np.sqrt([r[4] for r in tr])[:, None]
                      beta = np.linalg.lstsq(X(tr) * W, np.array([r[3] for r in tr]) * W[:, 0], rcond=None)[0]
                      err += list(X(te) @ beta - np.array([r[3] for r in te])); ys += [r[3] for r in te]
                  out[name] = (1 - np.mean(np.square(err)) / np.var(ys), np.mean(np.abs(err)))
              X = np.array([[1, r[1], r[2]] for r in rows]); beta = np.linalg.lstsq(X, np.array([r[3] for r in rows]), rcond=None)[0]
              print(f"{kind}: n={len(rows)} pairs {yrs[0]}-{yrs[-1]+1}, min {lo} PA both years. Out-of-sample R2 / MAE: " + ", ".join(f"{k} {v[0]:.3f} / {v[1]:.4f}" for k, v in out.items()) + f". Full-sample weights: wOBA {beta[1]:.2f}, xwOBA {beta[2]:.2f}")
          PY
