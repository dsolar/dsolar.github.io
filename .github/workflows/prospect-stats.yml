# Pulls NBA box scores and season lines from ESPN into prospect/stats.json for Prospect, the dynasty league.
# Runs every morning from October through June, when the script or this file changes, or by hand.
name: Prospect stats

on:
  schedule:
    - cron: "41 10 * 10-12,1-6 *"
  push:
    branches: [main]
    paths:
      - tools/prospect_pull.py
      - .github/workflows/prospect-stats.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospect-stats
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull box scores and season lines from ESPN
        run: python3 tools/prospect_pull.py

      - name: Commit the stats
        run: |
          git add prospect/stats.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update Prospect stats"
          git pull --rebase -q
          git push
