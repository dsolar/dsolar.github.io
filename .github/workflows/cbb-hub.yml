name: College basketball hub
on:
  schedule:
    - cron: "23 4,11,18 * * *"
  push:
    branches: [main, codex/college-basketball-hub]
    paths:
      - cbb/*.html
      - cbb/*.js
      - cbb/*.css
      - tools/cbb_build.py
      - tools/cbb_extras.py
      - tools/cbb_dfs.py
      - tools/cbb_pool_teams.py
      - tools/cbb_avail.py
      - cbb/data/naismith-watch.json
      - tests/cbb*.cjs
      - tests/cbb*.py
      - tests/fantasycbb.test.mjs
      - .github/workflows/cbb-hub.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: college-basketball-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install response decoder
        run: python -m pip install --disable-pip-version-check --quiet brotli==1.1.0
      - name: Build current college basketball data
        run: python3 tools/cbb_build.py
      - name: Naismith ladder and the hub's logged lines
        run: python3 tools/cbb_extras.py
      # who missed his team's last game, from ESPN box scores (cbb/data/avail.json); a miss keeps the last file
      - name: Who missed the last game
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/cbb_avail.py
      - name: Draft Lab college pool and featured slates
        run: python3 tools/cbb_dfs.py && python3 tools/fantasykit_teams.py cbb
      - name: March Madness pool teams
        run: python3 tools/cbb_pool_teams.py
      - name: Check JavaScript
        run: |
          node --check cbb/model.js
          if [ -f cbb/app.js ]; then node --check cbb/app.js; fi
          node --check assets/hubswitch.js
          node --check assets/projects.js
      - name: Verify calculations, imports and actual data
        run: |
          python3 -m unittest discover -s tests -p 'cbb_*test.py'
          node --test tests/cbb-model.test.cjs
          node --test tests/fantasycbb.test.mjs
      - name: Install DOM test dependency
        if: hashFiles('tests/cbb-ui.test.cjs') != ''
        run: npm install --no-package-lock --no-save --prefix "$RUNNER_TEMP/cbb-qa" jsdom@26.1.0
      - name: Check navigation, filters and player cards
        if: hashFiles('tests/cbb-ui.test.cjs') != ''
        env:
          NODE_PATH: ${{ runner.temp }}/cbb-qa/node_modules
        run: node --test tests/cbb-ui.test.cjs
      - name: Save current college basketball snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbb/data fantasy-kit/data/cbb.json fantasy-kit/data/weeks-cbb.json fantasy-kit/data/teams-cbb.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update college basketball ratings, rosters, lines and Naismith ladder"
          # another job may push at the same moment: pull and try again, up to five times
          for i in 1 2 3 4 5; do (git pull --rebase || { git rebase --abort; false; }) && git push && break; [ $i = 5 ] && exit 1; sleep $((i * 8)); done
