# Player news for Draft Lab: MLB.com's news feeds (news-mlb.json) and ESPN's for football, basketball and hockey
# (news-nfl/nba/nhl.json), matched to players.
# Headlines and links only. Commits only when there's a new story.
name: Draft Lab player news

on:
  push:
    branches: [main]
    paths:
      - tools/news_pull.py
      - tools/news_espn.py
      - .github/workflows/fantasykit-news.yml
  schedule:
    - cron: "41 */2 * * *"      # every two hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasykit-news
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Pull the news feeds
        run: python3 tools/news_pull.py
      - name: Pull ESPN's news feeds
        run: python3 tools/news_espn.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fantasy-kit/data/news-*.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Draft Lab: player news"
          # another job may push at the same moment: pull and try again, up to five times
          for i in 1 2 3 4 5; do (git pull --rebase -q origin main || { git rebase --abort; false; }) && git push && break; [ $i = 5 ] && exit 1; sleep $((i * 8)); done
