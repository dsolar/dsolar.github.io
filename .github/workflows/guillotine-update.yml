# Keeps davidsolar.dev/guillotine/ current.
#  - Yahoo first: tools/guillotine_update.py pulls standings, scores and every lineup with the three
#    YAHOO_ secrets (README: "Guillotine odds: keeping the data current"). Until Yahoo approves the
#    app it skips quietly.
#  - The paste second: guillotine/paste.txt holds copies of two Yahoo pages (league overview,
#    starting rosters). It rebuilds guillotine/data.json only while Yahoo isn't filling it, or when a
#    new paste is committed, so an old paste never overwrites fresher Yahoo data.
#  - Then player projections from Sleeper and this week's saved odds.
# Runs every morning, Sunday before kickoff, and whenever a paste or one of these scripts is committed.
name: Guillotine update

on:
  push:
    branches: [main]
    paths:
      - guillotine/paste.txt
      - tools/guillotine_update.py
      - tools/guillotine_paste.py
      - tools/guillotine_projections.py
      - tools/guillotine_snapshot.js
      - tools/guillotine_check.js
      - .github/workflows/guillotine-update.yml
  schedule:
    - cron: "17 14 * 9-12,1 *"   # 10:17am ET daily (9:17 in winter), September through January
    - cron: "47 16 * 9-12,1 0"   # 12:47pm ET Sundays, after inactives
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: guillotine-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull the league from Yahoo
        # A Yahoo problem shouldn't stop the projections refresh; the page footer shows Yahoo's state.
        continue-on-error: true
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          if [ -z "$YAHOO_REFRESH_TOKEN" ]; then
            echo "::notice::Yahoo isn't connected. Add the three YAHOO_ secrets to turn it on."
            exit 0
          fi
          python3 tools/guillotine_update.py

      - name: Read the pasted league pages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          SOURCE=$(python3 -c "import json; print(json.load(open('guillotine/data.json')).get('source', ''))")
          NEW_PASTE=0
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ]; then
            gh api "repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null \
              | grep -qx guillotine/paste.txt && NEW_PASTE=1
          fi
          STATUS=$(python3 -c "import json; print(json.load(open('guillotine/yahoo.json')).get('status', ''))")
          if [ "$SOURCE" = "Yahoo Fantasy" ] && { [ "$NEW_PASTE" = 0 ] || [ "$STATUS" = connected ]; }; then
            echo "Yahoo filled data.json; keep the API roster instead of replacing it with a paste."
          else
            python3 tools/guillotine_paste.py
          fi

      - name: Refresh player projections
        run: python3 tools/guillotine_projections.py

      - name: Verify roster and scoring consistency
        run: node tools/guillotine_check.js

      - name: Save this week's odds
        run: node tools/guillotine_snapshot.js

      - name: Commit the new data
        id: commit
        run: |
          # Skip timestamp-only changes to data.json; always keep a changed history.json or yahoo.json.
          DATA_SAME=0
          if git show HEAD:guillotine/data.json > /tmp/old.json 2>/dev/null && python3 - <<'PY'
          import json, sys
          def core(p):
              d = json.load(open(p)); d.pop("updated", None)
              if isinstance(d.get("proj_source"), dict): d["proj_source"].pop("updated", None)
              return d
          sys.exit(0 if core("/tmp/old.json") == core("guillotine/data.json") else 1)
          PY
          then
            DATA_SAME=1
          fi
          OTHER_CHANGED=$(git status --porcelain guillotine/history.json guillotine/yahoo.json)
          if [ "$DATA_SAME" = 1 ] && [ -z "$OTHER_CHANGED" ]; then
            echo "Nothing changed."
            exit 0
          fi
          if [ "$DATA_SAME" = 1 ]; then git checkout -- guillotine/data.json; fi
          git add guillotine/data.json guillotine/history.json guillotine/yahoo.json
          git commit -m "Update guillotine odds data"
          git pull --rebase -q origin main   # someone may have pushed while this ran
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
