# Rebuilds the Fantasy Kit's player pools (fantasy-kit/data/nba.json, nfl.json, mlb.json) and real weekly box scores
# (weeks-nba.json, weeks-nfl.json, weeks-mlb.json) for Draft Lab and the
# league pages: basketball from Hard Cap's ESPN lines, baseball from MLB's Stats API files in tools/mlb, football
# from Sleeper. Runs after each Hard Cap stats pull, when the script or this file changes, or by hand.
name: Fantasy Kit data

on:
  schedule:
    - cron: "47 11 * * *"
    - cron: "17 22 * * *"
    # football game nights (UTC): Sunday afternoon through Monday night, and Thursday night, every two hours
    - cron: "7 17,19,21,23 * * 0"
    - cron: "7 1,3,5,23 * * 1"
    - cron: "7 1,3,5 * * 2,5"
  push:
    branches: [main]
    paths:
      - tools/fantasykit_data.py
      - tools/dynasty_pull.py
      - tools/market_pull.py
      - tools/data_health.py
      - .github/workflows/fantasykit-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasykit-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build the player pools
        run: python3 tools/fantasykit_data.py

      - name: Pull outside dynasty rankings
        run: python3 tools/dynasty_pull.py
        continue-on-error: true

      - name: Pull ESPN ranks, ADP and auction prices
        run: python3 tools/market_pull.py
        continue-on-error: true

      - name: Check the data
        id: health
        run: python3 tools/data_health.py || echo "bad=1" >> "$GITHUB_OUTPUT"

      - name: Commit the pools
        run: |
          git add fantasy-kit/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update Fantasy Kit player pools"
          git pull --rebase -X theirs -q
          git push

      - name: Fail if any data looks wrong (GitHub emails about a failed run)
        if: steps.health.outputs.bad == '1'
        run: |
          python3 -c "import json; print('\n'.join(json.load(open('fantasy-kit/data/health.json'))['problems']))"
          exit 1
