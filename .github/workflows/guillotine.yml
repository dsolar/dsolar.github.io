# Refreshes davidsolar.dev/guillotine/ from Yahoo every morning during the football season.
# Reads league data with tools/guillotine_update.py, commits guillotine/data.json if it changed,
# then asks GitHub Pages to rebuild. Does nothing until the three Yahoo secrets are set
# (README: "Guillotine odds: connecting Yahoo"). Run it by hand from the Actions tab any time.
name: Guillotine odds

on:
  schedule:
    - cron: "47 13 * 9-12,1 *"   # 9:47am ET (8:47am in winter), September through January
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: guillotine-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Pull league data from Yahoo
        id: pull
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          if [ -z "$YAHOO_REFRESH_TOKEN" ]; then
            echo "::notice::Yahoo isn't connected yet. Add the three YAHOO_ secrets to turn this on."
            exit 0
          fi
          python3 tools/guillotine_update.py

      - name: Commit the new data
        id: commit
        run: |
          git add guillotine/data.json guillotine/yahoo.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update guillotine odds data"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
