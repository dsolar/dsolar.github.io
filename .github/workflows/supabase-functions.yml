# Deploys Supabase edge functions from the repo, so main is always what's live.
# A push that changes supabase/functions/<name>/ deploys that function (and only that one). Run it by hand to deploy
# one function by name. Every function here runs without Supabase's JWT check (--no-verify-jwt), as they always have.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      function:
        description: "Function to deploy (its folder name under supabase/functions, like fk-live)"
        required: true

# one deploy at a time, in push order, so an older commit never lands after a newer one
concurrency:
  group: supabase-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: baxrczyufqbzrogftmyn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Work out which functions to deploy
        id: which
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.function }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            list="$INPUT"
          else
            # a brand-new branch has no "before": compare with the previous commit instead
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE="HEAD~1"; fi
            list=$(git diff --name-only "$BEFORE" HEAD -- supabase/functions | cut -d/ -f3 | sort -u)
          fi
          keep=""
          for f in $list; do
            if ! printf '%s' "$f" | grep -Eq '^[a-z0-9][a-z0-9_-]*$'; then echo "::error::Not a function name: $f"; exit 1; fi
            if [ -f "supabase/functions/$f/index.ts" ]; then keep="$keep $f"; else echo "Skipping $f: no index.ts (removed?)"; fi
          done
          echo "Deploying:${keep:- nothing}"
          echo "list=$keep" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.which.outputs.list != ''
        env:
          LIST: ${{ steps.which.outputs.list }}
        run: |
          for f in $LIST; do
            echo "::group::$f"
            # the CLI from npm (setup-cli's "latest" lookup hits GitHub's rate limit); v3 asks before deploying, so --yes
            npx --yes supabase@3 functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
            echo "::endgroup::"
          done
