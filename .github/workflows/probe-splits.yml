name: probe-splits
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          get() { curl -s -A "$UA" -o /tmp/a.json -w "== $1 HTTP %{http_code} %{size_download}B\n" "$1"; python3 /tmp/s.py; }
          cat > /tmp/s.py <<'PY'
          import json,collections
          d=json.load(open('/tmp/a.json')); gs=d.get('games') or []
          withm=[g for g in gs if g.get('markets')]
          print('games',len(gs),'with markets',len(withm),'num_bets',[g.get('num_bets') for g in gs][:8])
          books=collections.Counter(); bi=collections.Counter()
          for g in withm:
            for b,m in g['markets'].items():
              books[b]+=1
              for typ,rows in (m.get('event') or {}).items():
                for r in rows:
                  x=r.get('bet_info') or {}
                  if (x.get('tickets') or {}).get('percent') is not None: bi[(b,'tix')]+=1
                  if (x.get('money') or {}).get('percent') is not None: bi[(b,'money')]+=1
          print('books',dict(books)); print('bet_info by book',dict(bi))
          if withm:
            g=withm[0]; t={x['id']:x.get('abbr') or x.get('display_name') for x in g['teams']}
            for b,m in g['markets'].items():
              for typ,rows in (m.get('event') or {}).items():
                print(' ',b,typ,[(t.get(r.get('team_id'),r.get('side')),r.get('value'),r.get('odds'),(r.get('bet_info') or {}).get('tickets',{}).get('percent'),(r.get('bet_info') or {}).get('money',{}).get('percent')) for r in rows])
          PY
          get "https://api.actionnetwork.com/web/v2/scoreboard/nfl?bookIds=15,30,68,69,75,79,123,972&week=12&seasonType=reg"
          get "https://api.actionnetwork.com/web/v2/scoreboard/ncaab?bookIds=15,30&date=20261122"
          get "https://api.actionnetwork.com/web/v2/scoreboard/ncaab?bookIds=15,30&date=20261124"
          get "https://api.actionnetwork.com/web/v2/scoreboard/ncaaf?bookIds=15,30&week=13&seasonType=reg"
          get "https://api.actionnetwork.com/web/v2/scoreboard/nba?bookIds=15,30&date=20261122"
          get "https://api.actionnetwork.com/web/v2/scoreboard/nhl?bookIds=15,30&date=20261122"
