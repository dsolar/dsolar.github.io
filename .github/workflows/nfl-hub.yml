# Builds the NFL Hub's league file (rosters, contracts by year, depth charts, snap shares) and player rating from
# nflverse's public data.
# Runs every day after nflverse's morning refresh, when the script or this file changes, or by hand.
name: NFL Hub data

on:
  schedule:
    - cron: "47 16 * * *"   # 11:47am ET in winter
  push:
    branches: [main]
    paths:
      - tools/nfl_pull.py
      - tools/nfl_teamcap.py
      - tools/nfl_rating.py
      - tools/nfl_teamstats.py
      - tools/nfl_adv.py
      - tools/nfl_fpi.py
      - .github/workflows/nfl-hub.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-hub
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install pyarrow, numpy and scipy (parquet files, and the player rating's ridge regression)
        run: pip install pyarrow numpy scipy

      # Over The Cap's team totals (cap space, active spending, dead money); keeps the last copy if the page won't parse
      - name: Team cap totals
        continue-on-error: true
        run: python3 tools/nfl_teamcap.py

      - name: Build the league file
        run: python3 tools/nfl_pull.py

      # NFL Next Gen Stats (separation, CPOE, rush yards over expected...) from nflverse's copies; a miss keeps the last file
      - name: Pull Next Gen Stats
        continue-on-error: true
        run: python3 tools/nfl_ngs.py

      # team offense and defense (EPA, success rate, explosive plays...) for the game previews; a miss keeps the last file
      - name: Team offense and defense
        continue-on-error: true
        run: python3 tools/nfl_teamstats.py

      # ESPN QBR, Pro Football Reference's and FTN's charting, EPA by player and each team's style; a miss keeps the last file
      - name: Advanced stats
        continue-on-error: true
        run: python3 tools/nfl_adv.py

      # ESPN's Football Power Index beside the hub's own ratings; a miss keeps the last file
      - name: ESPN FPI
        continue-on-error: true
        run: python3 tools/nfl_fpi.py

      # The on-field rating rests on the last two seasons of play-by-play, which only change in the offseason, so
      # rebuild it on Mondays (or when the script changes) rather than every day
      - name: Build the player rating
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" != "schedule" ] || [ ! -f nfl/data/rating.json ]; then
            python3 tools/nfl_rating.py
          else
            echo "Not Monday; keeping the current rating."
          fi

      # the schedule and results on their own (a few KB), for pages that only need the games: the survivor planner
      - name: Pull out the games
        run: node -e "const fs=require('fs');const L=JSON.parse(fs.readFileSync('nfl/data/league.json'));fs.writeFileSync('nfl/data/games.json',JSON.stringify({season:L.season,week:L.week,updated:L.updated,games:L.games}))"

      # the season simulation, so phones don't run 6,000 seasons on load (the page falls back to running it)
      - name: Simulate the season
        run: node tools/nfl_sim.js

      - name: Commit it
        run: |
          git add nfl/data/teamcap.json nfl/data/league.json nfl/data/weeks.json nfl/data/rating.json nfl/data/games.json nfl/data/sim.json nfl/data/ngs.json nfl/data/teamstats.json nfl/data/adv.json nfl/data/fpi.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update NFL Hub data"
          # another job may push at the same moment: pull and try again, up to five times
          for i in 1 2 3 4 5; do (git pull --rebase -X theirs -q || { git rebase --abort; false; }) && git push && break; [ $i = 5 ] && exit 1; sleep $((i * 8)); done
