# Rebuilds the NHL hub (nhl/): pulls standings, rosters, stats and schedules from NHL's API and the season files from
# MoneyPuck.com (tools/nhl_hub_pull.py, trimmed snapshots in tools/nhl_hub/), then builds the page data
# (tools/nhl_hub_build.py, nhl/data/). Runs every morning, when either script changes, and by hand from the Actions tab.
name: NHL hub

on:
  schedule:
    - cron: "41 10 * * *"   # 5:41am ET, after last night's late games
  push:
    branches: [main]
    paths:
      - tools/nhl_hub_pull.py
      - tools/nhl_hub_build.py
      - .github/workflows/nhl-hub.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull from NHL and MoneyPuck
        # A failed part keeps its last good snapshot, so the build below still runs
        continue-on-error: true
        run: python3 tools/nhl_hub_pull.py

      - name: Catch up with main
        run: |
          git stash -q -u || true
          git pull --rebase -q origin main
          git stash pop -q || true

      - name: Build the hub data
        run: |
          if [ -f tools/nhl_hub_build.py ]; then python3 tools/nhl_hub_build.py; fi

      # NHL Edge tracking (skating speed, shot speed, zone time; goalie save % by shot location) for every player,
      # about 800 small calls; a miss keeps the last good file
      - name: Pull NHL Edge
        continue-on-error: true
        timeout-minutes: 20
        run: python3 tools/nhl_edge.py

      # card-sized copies of the tracking files for Draft Lab's player cards
      - name: Card-sized tracking files
        continue-on-error: true
        run: python3 tools/track_cards.py nhl

      - name: Refresh fantasy players and contracts
        continue-on-error: true
        run: node tools/fantasykit_nhl.mjs --pool-only

      - name: Commit
        run: |
          mkdir -p nhl/data
          git add tools/nhl_hub nhl/data fantasy-kit/data/nhl.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update the NHL hub"
          # another job may push at the same moment: pull and try again, up to five times
          for i in 1 2 3 4 5; do (git pull --rebase -q || { git rebase --abort; false; }) && git push && break; [ $i = 5 ] && exit 1; sleep $((i * 8)); done
