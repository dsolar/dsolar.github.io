# Pulls this season's NBA stats and standings from ESPN into celtics/live.json for Banner 19.
# Runs every morning from October through June, when the script or this file changes, or by hand.
name: NBA live stats

on:
  schedule:
    - cron: "17 10 * 10-12,1-6 *"
  push:
    branches: [main]
    paths:
      - tools/nba_live_pull.py
      - .github/workflows/nba-live.yml
  workflow_dispatch:
    inputs:
      season:
        description: "Season to pull, named by the year it ends (blank = current)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nba-live
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        # Set for the whole job: the rebase before pushing rewrites the commit and needs it too.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull stats and standings from ESPN
        run: python3 tools/nba_live_pull.py ${{ github.event.inputs.season }}

      - name: Commit the stats
        run: |
          git add celtics/live.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update NBA live stats for Banner 19"
          git pull --rebase -q
          git push
