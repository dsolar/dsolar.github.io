name: probe otc
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for y in 2026 2027; do
            curl -sL -A "Mozilla/5.0" -o otc$y.html -w "$y %{http_code} %{size_download}\n" https://overthecap.com/salary-cap-space/$y
          done
          python3 - <<'PY'
          import re
          h=open('otc2027.html').read()
          for m in re.finditer(r'<table class="sortable salary-cap-space-table', h):
              print('---', re.sub(r'\s+',' ',h[m.start()-600:m.start()]))
          PY
