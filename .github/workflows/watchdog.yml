name: Data job watchdog
# When a data job fails, open one GitHub issue for it (GitHub emails the repo owner); when it next passes, close it.
# Repeat failures don't add anything, so a job that stays broken sends one email, and a fixed job sends one more.
on:
  workflow_run:
    workflows:
      - Calendar update
      - College basketball hub
      - College football hub
      - Big Board
      - Player faces
      - Fantasy Kit data
      - Draft Lab player news
      - Draft Lab tests
      - Guillotine update
      - Hard Cap stats
      - MLB hub
      - MLB season stats
      - NBA DARKO
      - NBA data freshness
      - NBA lineups
      - NBA live stats
      - NBA future picks
      - NBA ratings
      - NBA Ringer Top 100
      - NBA tracking
      - NFL Hub data
      - NHL hub
      - Tonight's games
      - Torvik ratings
      - Ticket prices
      - Wipe Yoenis box scores
      - Wipe Yoenis Yahoo pull
    types: [completed]
permissions:
  issues: write
  actions: read
concurrency:
  group: watchdog-${{ github.event.workflow_run.name }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Open or close the issue for this job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB: ${{ github.event.workflow_run.name }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="Data job failing: $JOB"
          gh label create data-job --repo "$REPO" --color B60205 --description "A scheduled data job is failing" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label data-job --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$RESULT" = "failure" ]; then
            if [ -n "$open" ]; then echo "Already open: #$open"; exit 0; fi
            # the step that failed, so the email says where to look
            step=$(gh run view "${URL##*/}" --repo "$REPO" --json jobs --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | first // "unknown"' 2>/dev/null || echo unknown)
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "**$JOB** failed, so its data isn't updating. Failed step: **$step** (started by: $EVENT, commit ${SHA:0:7})." \
              "Run: $URL" \
              "This issue closes itself the next time the job passes.")
            gh issue create --repo "$REPO" --title "$title" --label data-job --body "$body"
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$REPO" --comment "Fixed: $JOB passed again ($URL)."
          fi
