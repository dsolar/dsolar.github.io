# Pulls MLB season stats (2013 on) from MLB's public Stats API into tools/mlb/ for the
# Wipe Yoenis awards, player stat cards and Best keepers. Runs when the script or this file changes, by hand
# from the Actions tab, and Monday mornings (just this year's stats then, which is all that changes).
name: MLB season stats

on:
  push:
    branches: [main]
    paths:
      - tools/mlb_stats_pull.py
      - tools/yoenis_keeper_value.py
      - .github/workflows/mlb-stats.yml
  schedule:
    - cron: "37 13 * * 1"   # 9:37am ET Mondays
  workflow_dispatch:
    inputs:
      by:
        description: "cron when the Supabase scheduler starts it on the daily timetable (tools/gh_scheduler.sql); blank by hand"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mlb-stats
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        # Set for the whole job: the rebase before pushing rewrites the commit and needs it too.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull season stats from MLB
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.by }}" = "cron" ]; then python3 tools/mlb_stats_pull.py "$(date +%Y)"; else python3 tools/mlb_stats_pull.py; fi

      - name: Catch up with main before touching the page data
        # The full pull takes a while; anything pushed meanwhile is picked up here, so the rebuild below starts
        # from it and the commit doesn't collide with it
        run: |
          git stash -q
          git pull --rebase -q origin main
          git stash pop -q

      - name: Refresh the player stat cards
        run: python3 tools/yoenis_stat_cards.py

      - name: Refresh keeper years, Best keepers and the keeper of the year
        run: python3 tools/yoenis_keeper_value.py

      - name: Commit the stats
        run: |
          git add tools/mlb yoenis/data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update MLB season stats for Wipe Yoenis awards"
          # another job may push at the same moment: pull and try again, up to five times
          for i in 1 2 3 4 5; do (git pull --rebase -q || { git rebase --abort; false; }) && git push && break; [ $i = 5 ] && exit 1; sleep $((i * 8)); done
