# Pulls MLB season stats (2013 on) from MLB's public Stats API into tools/mlb/ for the
# Wipe Yoenis awards, player stat cards and Best keepers. Runs when the script or this file changes, by hand
# from the Actions tab, and Monday mornings (just this year's stats then, which is all that changes).
name: MLB season stats

on:
  push:
    branches: [main]
    paths:
      - tools/mlb_stats_pull.py
      - tools/yoenis_keeper_value.py
      - .github/workflows/mlb-stats.yml
  schedule:
    - cron: "37 13 * * 1"   # 9:37am ET Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-stats
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        # Set for the whole job: the rebase before pushing rewrites the commit and needs it too.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull season stats from MLB
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python3 tools/mlb_stats_pull.py "$(date +%Y)"; else python3 tools/mlb_stats_pull.py; fi

      - name: Refresh the player stat cards
        run: python3 tools/yoenis_stat_cards.py

      - name: Refresh keeper years, Best keepers and the keeper of the year
        run: python3 tools/yoenis_keeper_value.py

      - name: Commit the stats
        run: |
          git add tools/mlb yoenis/data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update MLB season stats for Wipe Yoenis awards"
          git pull --rebase -q
          git push
