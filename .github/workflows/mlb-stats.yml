# Pulls MLB season stats (2013 on) from MLB's public Stats API into tools/mlb/ for the
# Wipe Yoenis awards and player stat cards. Runs when the script or this file changes, or by hand from the Actions tab.
name: MLB season stats

on:
  push:
    branches: [main]
    paths:
      - tools/mlb_stats_pull.py
      - .github/workflows/mlb-stats.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-stats
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set the bot's git identity
        # Set for the whole job: the rebase before pushing rewrites the commit and needs it too.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull season stats from MLB
        run: python3 tools/mlb_stats_pull.py

      - name: Refresh the player stat cards
        run: python3 tools/yoenis_stat_cards.py

      - name: Commit the stats
        run: |
          git add tools/mlb yoenis/data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update MLB season stats for Wipe Yoenis awards"
          git pull --rebase -q
          git push
