<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prospect | David Solar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Salary-cap dynasty basketball: real NBA salaries, one hard ceiling, a college draft and nine-category weeks scored from real box scores.">
<meta name="theme-color" content="#121A3A">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Besley:wght@700&family=Libre+Franklin:wght@500&display=swap">
<link rel="stylesheet" href="../assets/bar.css">
<script src="../assets/analytics.js" defer></script>
<style>
/* Prospect. The payroll is the brand: every contract is a block on the cap bar, stacked toward one hard
   ceiling, with hatched space held back for the spots you still have to fill. Arena navy for structure,
   court blue for you and your actions, cap gold for money, red only when a move breaks the ceiling.
   One family, Archivo, used at two widths: condensed for scoreboard numbers and names, normal for reading. */
:root{
  --arena:#121A3A; --arena-2:#1D2752; --floor:#EEF1F6; --surface:#FFFFFF; --sunk:#E3E7EF; --line:#CDD3DF;
  --ink:#121A3A; --muted:#566079; --key:#2F4BFF; --key-ink:#2338D6; --key-soft:#E2E7FF;
  --cap:#FFB000; --cap-ink:#8A5A00; --cap-soft:#FFF1CC; --foul:#D7263D; --foul-soft:#FCE4E7; --go:#0F8A57; --go-soft:#DDF3E8;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:6px; --gut:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --floor:#0E1430; --surface:#161E42; --sunk:#1F2850; --line:#2E3966; --ink:#EEF1F8; --muted:#A3ACC8;
    --key:#6F84FF; --key-ink:#A9B6FF; --key-soft:#232F6E; --cap-ink:#FFC94D; --cap-soft:#3A2F12;
    --foul:#FF5C70; --foul-soft:#3E1A24; --go:#3DD497; --go-soft:#123A2B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --floor:#0E1430; --surface:#161E42; --sunk:#1F2850; --line:#2E3966; --ink:#EEF1F8; --muted:#A3ACC8;
  --key:#6F84FF; --key-ink:#A9B6FF; --key-soft:#232F6E; --cap-ink:#FFC94D; --cap-soft:#3A2F12;
  --foul:#FF5C70; --foul-soft:#3E1A24; --go:#3DD497; --go-soft:#123A2B; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:400 15px/1.5 var(--f);font-variation-settings:"wdth" 100}
button,input,select{font:inherit;color:inherit}
a{color:var(--key-ink)}
.num{font-variant-numeric:tabular-nums}
.cond{font-variation-settings:"wdth" 70}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gut)}
.grow{flex:1}
.table tr.cut td{border-bottom:2px solid var(--cap)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}

/* masthead */
.mast{background:var(--arena);color:#EEF1F8}
.mast .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.mark svg{flex:none}
.mark b{font-weight:900;font-size:24px;letter-spacing:-.01em;font-variation-settings:"wdth" 72;line-height:1}
.mast .meta{color:#A9B3D6;font-size:13px}
.mast .grow{flex:1}
.mast nav{display:flex;gap:4px;flex-wrap:wrap}
.mast nav button{background:none;border:0;color:#C6CDE6;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px}
.mast nav button[aria-current="page"]{background:var(--arena-2);color:#fff;box-shadow:inset 0 -2px 0 var(--cap)}
.mast nav button:hover{color:#fff}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--key);border-color:var(--key);color:#fff}
.btn.go:hover{background:var(--key-ink);border-color:var(--key-ink)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label,.field .lab{font-weight:600;font-size:13px;color:var(--muted)}
.field input,.field select{min-height:42px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 12px;width:100%}
.seg{display:inline-flex;justify-self:start;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--arena);color:#fff}

/* the cap bar */
.capbar{display:grid;gap:6px}
.capbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.capbar-top strong{font-size:26px;font-weight:800;font-variation-settings:"wdth" 70;line-height:1}
.capbar-top .room{font-weight:700}
.capbar-top .room.ok{color:var(--go)} .capbar-top .room.bad{color:var(--foul)}
.track{position:relative;height:44px;background:var(--sunk);border-radius:4px;overflow:visible}
.blocks{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:4px}
.blk{height:100%;border-right:2px solid var(--floor);background:var(--key);color:#fff;font-size:12px;font-weight:700;font-variation-settings:"wdth" 68;padding:4px 5px;overflow:hidden;white-space:nowrap;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;transition:flex-basis .25s}
.blk:nth-child(even){background:var(--key-ink)}
.blk span{opacity:.8;font-weight:600}
.blk.ghost{background:repeating-linear-gradient(-45deg,var(--cap) 0 6px,#FFC94D 6px 12px);color:#2B1D00}
.blk.ghost.bad{background:repeating-linear-gradient(-45deg,var(--foul) 0 6px,#F25366 6px 12px);color:#fff}
.blk.hold{background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--muted) 35%,transparent) 5px 7px);color:var(--muted)}
.tick{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px solid var(--ink)}
.tick.cap{border-left:2px dashed var(--muted)}
.tick label{position:absolute;top:100%;left:-1px;transform:translateX(-50%);margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}
.tick.ceil{right:0;left:auto}
.tick.ceil label{transform:translateX(-100%);left:0}
.capbar-foot{height:16px}
.capbar.mini .track{height:12px}
.capbar.mini .blk{font-size:0;padding:0;border-right-width:1px}
.capbar.mini .tick{top:-3px;bottom:-3px}
.capbar.mini .tick label,.capbar.mini .capbar-foot{display:none}

/* setup */
.hero{padding:44px 0 28px}
.hero h1{margin:0;font-weight:900;font-size:clamp(42px,8.4vw,92px);line-height:.9;letter-spacing:-.02em;font-variation-settings:"wdth" 62}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--key)}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:18px 0 0}
.hero .capbar{margin-top:30px;max-width:900px}
.hero .capbar .blk{animation:stack .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes stack{from{transform:translateX(-30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero .capbar .blk{animation:none}.blk{transition:none}}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;padding:10px 0 60px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel h2{margin:0 0 4px;font-size:22px;font-weight:800;font-variation-settings:"wdth" 75}
.panel>p{margin:0 0 18px;color:var(--muted)}
.form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.rules li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.rules b{font-weight:800;font-variation-settings:"wdth" 72;font-size:17px;line-height:1.2}
.rules span{color:var(--muted)}

/* draft room */
.clockbar{background:var(--arena);color:#EEF1F8;border-top:1px solid var(--arena-2)}
.clockbar .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.onclock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.onclock .who{font-weight:900;font-size:28px;font-variation-settings:"wdth" 66;line-height:1}
.onclock .who.you{color:var(--cap)}
.onclock .pk{color:#A9B3D6;font-size:14px}
.timer{font-weight:900;font-size:34px;font-variation-settings:"wdth" 62;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right;color:#fff;line-height:1}
.timer.hot{color:#FF6B7D}
.clockbar .grow{flex:1}
.clockbar .btn{background:var(--arena-2);border-color:#38457A;color:#fff}
.clockbar .btn.go{background:var(--key);border-color:var(--key)}
.room-grid>*,.side>*{min-width:0}
.room-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;padding:18px 0 60px;align-items:start}
.mycap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 6px;margin-top:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:180px;min-height:40px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 12px}
.tools select{min-height:40px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 10px}
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.table th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;background:var(--sunk);white-space:nowrap}
.table td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.table td.r,.table th.r{text-align:right}
.table tr.dim td{opacity:.42}
.table tr.hl td{background:var(--key-soft)}
.pname{font-weight:700;font-variation-settings:"wdth" 82;line-height:1.2}
.psub{font-size:12px;color:var(--muted)}
.sal{font-weight:800;font-variation-settings:"wdth" 70;font-size:16px;white-space:nowrap}
.why{font-size:12px;color:var(--foul)}
.scroll{max-height:68vh;overflow:auto;border-radius:10px;border:1px solid var(--line)}
.scroll .table{border:0;border-radius:0}
.scroll .table th{position:sticky;top:0;z-index:1}
.side{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:17px;font-weight:800;font-variation-settings:"wdth" 75}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--arena);border-color:var(--arena);color:#fff}
.picks{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:52vh;overflow:auto}
.picks li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.picks li.you{background:var(--key-soft)}
.picks .no{font-weight:800;font-variation-settings:"wdth" 66;color:var(--muted)}
.board{overflow:auto;max-height:60vh}
.board table{border-collapse:separate;border-spacing:3px;font-size:12px}
.board th{font-weight:700;color:var(--muted);padding:2px 4px;white-space:nowrap;font-variation-settings:"wdth" 75;position:sticky;top:0;background:var(--surface)}
.board td{background:var(--sunk);border-radius:4px;padding:4px 6px;min-width:84px;vertical-align:top;line-height:1.2}
.board td.f{background:var(--key-soft)}
.board td.you{box-shadow:inset 3px 0 0 var(--key)}
.board td.now{background:var(--cap-soft);box-shadow:inset 0 0 0 2px var(--cap)}
.board td b{display:block;font-variation-settings:"wdth" 75}
.board td small{color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}

/* league */
.weekbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 0 6px}
.weekbar h1{margin:0;font-weight:900;font-size:clamp(30px,5vw,46px);font-variation-settings:"wdth" 66;line-height:1}
.weekbar .grow{flex:1}
.weekbar .src{color:var(--muted);font-size:13px}
.note{background:var(--cap-soft);border:1px solid color-mix(in srgb,var(--cap) 50%,transparent);border-radius:8px;padding:10px 14px;font-size:14px;margin:10px 0 0}
.lg{padding:12px 0 60px;display:grid;gap:18px}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.versus .tm{display:grid;gap:2px}
.versus .tm.b{text-align:right}
.versus .tm b{font-weight:900;font-size:24px;font-variation-settings:"wdth" 66;line-height:1.05}
.versus .score{font-weight:900;font-size:52px;font-variation-settings:"wdth" 62;line-height:.9;font-variant-numeric:tabular-nums;text-align:center}
.versus .score small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.cats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-top:16px}
.cat{background:var(--sunk);border-radius:6px;padding:8px 6px;text-align:center;display:grid;gap:2px}
.cat .k{font-size:12px;font-weight:700;color:var(--muted)}
.cat .v{font-weight:800;font-variation-settings:"wdth" 70;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.1}
.cat .v.w{color:var(--go)} .cat .v.l{color:var(--muted);font-weight:600}
.cat.w-a{box-shadow:inset 0 3px 0 var(--key)} .cat.w-b{box-shadow:inset 0 -3px 0 var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;cursor:pointer;text-align:left}
.game:hover{border-color:var(--muted)}
.game .ln{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-variation-settings:"wdth" 80}
.game .ln.lead{color:var(--ink)} .game .ln.trail{color:var(--muted);font-weight:600}
.game.you{border-color:var(--key)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--sunk);color:var(--muted)}
.pill.w{background:var(--go-soft);color:var(--go)} .pill.l{background:var(--foul-soft);color:var(--foul)}
.pill.opt{background:var(--cap-soft);color:var(--cap-ink)}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.log time{color:var(--muted);font-size:12px;min-width:84px}
.teampick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--arena);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(18,26,58,.35)}
.toast.bad{background:var(--foul)}
.foot{color:var(--muted);font-size:13px;padding:20px 0 40px;border-top:1px solid var(--line)}
.loading{padding:80px 0;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(18,26,58,.5)}
dialog h3{margin:0 0 6px;font-weight:800;font-size:20px;font-variation-settings:"wdth" 75}
dialog .form{margin-top:14px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

@media (max-width:900px){
  .setup,.room-grid,.two{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(5,minmax(0,1fr))}
  .hide-m{display:none}
  .scroll{max-height:none}
}
@media (max-width:560px){
  .row2{grid-template-columns:1fr}
  .rules li{grid-template-columns:1fr;gap:2px}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .versus .score{font-size:40px}
  .versus .tm b{font-size:19px}
  .table td,.table th{padding:7px 6px}
  .hide-s{display:none}
  .timer{font-size:28px}
  .tick.cap label{display:none}
  .onclock .who{font-size:22px}
}
</style>
</head>
<body>
<nav class="ds-bar" aria-label="davidsolar.dev"><a href="../"><img src="../assets/ds-mark.svg" alt="" width="20" height="20"><span class="ds-bar-name">David Solar</span></a><a href="../#projects">All projects</a></nav>
<header class="mast">
  <div class="wrap">
    <a class="mark" href="./" aria-label="Prospect home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#2F4BFF"/><rect x="7" y="22" width="5" height="6" fill="#FFB000"/><rect x="13" y="16" width="5" height="12" fill="#fff"/><rect x="19" y="10" width="5" height="18" fill="#fff"/><rect x="6" y="7" width="22" height="2.4" fill="#FFB000"/></svg>
      <b>Prospect</b>
    </a>
    <span class="meta" id="mastMeta">Salary-cap dynasty basketball</span>
    <span class="grow"></span>
    <nav id="mastNav" aria-label="League"></nav>
  </div>
</header>
<div id="app"><div class="wrap loading">Loading players and contracts…</div></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
