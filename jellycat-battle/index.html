.lobby-window.left{left:9%}.lobby-window.right{right:9%}

function stepWorld(s,dx,dy){

 if(x===w.x&&y===w.y)return {moved:false,zone:null,treasure:null,npc:null};
 const gate=areaGate('cuddlewick',x,y);if(gate){w.area=gate.area;w.x=gate.x;w.y=gate.y;w.steps++;if(!w.visited.includes(gate.area))w.visited.push(gate.area);return {moved:true,transition:gate,zone:{id:gate.area,name:gate.message},treasure:null};}
 if(villageBlockedAt(x,y))return {moved:false,blocked:true,zone:null,treasure:null,npc:null};
 const npc=NPCS.find(n=>Math.hypot(n.x-x,n.y-y)<.72);
 if(npc)return {moved:false,npc,zone:null,treasure:null};
 const previous={x:w.x,y:w.y};w.x=x;w.y=y;w.steps++;
 const zone=zoneAt(x,y);let newZone=null;
 if(!w.visited.includes(zone)){w.visited.push(zone);newZone=ZONES.find(z=>z.id===zone);s.history.push(`Explored ${newZone.name}`);s.history=s.history.slice(-30);}
 const treasure=TREASURES.find(t=>Math.hypot(t.x-x,t.y-y)<.55&&!w.found.includes(t.id));
 if(treasure){w.found.push(treasure.id);s.points+=treasure.points;s.history.push(`Found ${treasure.title} (+${treasure.points} star)`);s.history=s.history.slice(-30);}
 return {moved:true,zone:newZone,treasure,npc:null,encounter:rollGrassEncounter(w,previous.x,previous.y)};
}

const HOME_ZONES=new Set(['wood','garden','moon','bakery','square','cove','sports','hill']);
function objectiveCount(s,obj){const [kind,value]=obj;const w=s.world||{};
 if(kind==='flag')return (w.storyFlags||[]).includes(value)?1:0;
 if(kind==='talk')return (w.talked||[]).includes(value)?1:0;
 if(kind==='mini')return (w.completed||[]).includes(value)?1:0;
 if(kind==='find')return (w.found||[]).includes(value)?1:0;
 if(kind==='visit')return (w.visited||[]).includes(value)?1:0;
 if(kind==='wins')return Math.min(value,s.wins||0);
 if(kind==='visits')return Math.min(value,(w.visited||[]).filter(id=>HOME_ZONES.has(id)).length);
 if(kind==='activities')return Math.min(value,(w.completed||[]).length);
 if(kind==='badge')return (w.parlorBadges||[]).includes(value)?1:0;
 if(kind==='patches')return Math.min(value,value===4?(w.parlorBadges||[]).filter(id=>['village','garden','cove','moon'].includes(id)).length:(w.parlorBadges||[]).length);
 if(kind==='souvenir')return (w.souvenirs||[]).includes(value)?1:0;
 if(kind==='wish')return Math.min(value,w.wishes||0);
 if(kind==='camp')return w.campVisited?1:0;
 return 0;
}
function objectiveTarget(obj){return ['wins','visits','activities','patches','wish','camp'].includes(obj[0])?obj[1]:1;}
function questProgress(s,q){const completed=q.objectives.map(o=>objectiveCount(s,o));const total=q.objectives.map(o=>objectiveTarget(o));return {completed,total,done:completed.every((n,i)=>n>=total[i]),claimed:(s.world?.claimedQuests||[]).includes(q.id)};}
function outstandingQuests(s){return QUESTS.filter(q=>!questProgress(s,q).claimed)}
function claimQuest(s,id,grantXp){const q=QUESTS.find(q=>q.id===id);if(!q)throw Error('Unknown adventure');const status=questProgress(s,q);if(status.claimed||!status.done)throw Error('That adventure is not ready to claim.');
 s.world.claimedQuests??=[];s.world.claimedQuests.push(id);s.points+=q.reward.stars;s.jars+=q.reward.bags;
 for(const member of s.team)grantXp(s,member,q.reward.xp);
 s.history.push(`Adventure completed: ${q.title} (+${q.reward.stars} stars)`);s.history=s.history.slice(-30);
 return q;
}
function saveMiniScore(s,id,score,grantXp,completeChallenge){if(!Number.isInteger(score)||score<0||score>3)throw Error('Invalid mini-game score');if(!['baker','garden','wood','moon','sea','sports'].includes(id))throw Error('Unknown mini-game');
 s.world.miniBests??={};s.world.miniAttempts??={};s.world.miniAttempts[id]=(s.world.miniAttempts[id]||0)+1;
 const previous=s.world.miniBests[id]||0,oldComplete=s.world.completed.includes(id);s.world.miniBests[id]=Math.max(previous,score);
 if(score>=1&&!oldComplete){completeChallenge(s,id);s.team.forEach(member=>grantXp(s,member,20+score*10));}
 if(score===3&&previous<3){s.points++;s.history.push(`Golden ribbon in ${id}: +1 star`);s.history=s.history.slice(-30);}
 return {firstClear:score>=1&&!oldComplete,improved:score>previous,gold:score===3&&previous<3,score,best:s.world.miniBests[id]};
}

function loadSave(){try{const v=localStorage.getItem(SAVE_KEY);if(v)return validateSave(JSON.parse(v));const old=JSON.parse(localStorage.getItem('jbc-v2')||'null');if(old){const d=freshSave();d.nicknames[STARTER_ID]=String(old.names?.croissant||'').slice(0,24);d.onboarded=!!old.onboarded;d.wins=Math.max(0,old.wins|0);d.losses=Math.max(0,old.losses|0);d.streak=Math.max(0,old.streak|0);d.bestStreak=d.streak;d.points=Math.max(0,old.points|0);d.jars=Math.max(0,old.jars|0);d.levels[STARTER_ID]=Math.max(1,old.levels?.croissant||1);d.xp[STARTER_ID]=Math.max(0,old.xp?.croissant||0);return validateSave(d);}}catch(e){console.warn('Save recovery:',e)}return freshSave();}
function persist(){state=ensureWorld(validateSave(state));try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){notify('Could not save progress in this browser. Check storage permissions.');}}
function update(fn){state=fn(state);persist();render();}
function el(tag,cl,text){const x=document.createElement(tag);if(cl)x.className=cl;if(text)x.textContent=text;return x;}

 const w=state.world,key=(x,y)=>y*bounds.width+x,sx=Math.round(w.x),sy=Math.round(w.y),queue=[[sx,sy]],seen=new Set([key(sx,sy)]),parent=new Map(),blocked=new Set((w.area==='cuddlewick'?NPCS:areaNpcs(w.area)).map(n=>key(n.x,n.y)));let head=0,found=false;
 while(head<queue.length){const [cx,cy]=queue[head++];if(cx===tx&&cy===ty){found=true;break;}for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){const nx=cx+dx,ny=cy+dy,k=key(nx,ny);if(nx<0||nx>=bounds.width||ny<0||ny>=bounds.height||(w.area!=='cuddlewick'?!walkableRegion(state,w.area,nx,ny):(villageBlockedAt(nx,ny)&&!areaGate('cuddlewick',nx,ny)))||seen.has(k)||blocked.has(k))continue;seen.add(k);parent.set(k,[cx,cy]);queue.push([nx,ny]);}}
 if(!found){notify('That place is occupied. Try the path beside it.');return;}
 const waypoints=[];let cur=[tx,ty];while(cur[0]!==sx||cur[1]!==sy){waypoints.push(cur);cur=parent.get(key(cur[0],cur[1]));if(!cur)break;}waypoints.reverse();if(!waypoints.length&&Math.hypot(w.x-tx,w.y-ty)>.15)waypoints.push([tx,ty]);
 let at=0,frames=0;walkingTimer=setInterval(()=>{if(page!=='world'||document.querySelector('.modal-backdrop')||frames++>1400){stopWalking();return;}if(at>=waypoints.length){stopWalking();if(npcToMeet)showTalk(npcToMeet);else if(placeToMeet)showPlace(placeToMeet);return;}
  const [x,y]=waypoints[at],dX=x-state.world.x,dY=y-state.world.y;
  if(Math.abs(dX)+Math.abs(dY)<.15){at++;return;}
  const deltaX=Math.abs(dX)>.08?Math.sign(dX)*Math.min(.14,Math.abs(dX)):0;

 },28);
}

// v0.6: A stable, analog-feeling touch joystick that survives map refreshes.
const touchStick=document.getElementById('touch-stick'),stickThumb=document.getElementById('stick-thumb');
const touchMotion={pointerId:null,x:0,y:0,last:0,raf:0};
function stopTouchWalking(){
 if(touchMotion.raf)cancelAnimationFrame(touchMotion.raf);
 touchMotion.raf=0;touchMotion.last=0;touchMotion.pointerId=null;touchMotion.x=0;touchMotion.y=0;
 touchStick?.classList.remove('steering');if(stickThumb){stickThumb.style.setProperty('--stick-x','0px');stickThumb.style.setProperty('--stick-y','0px');}
 finishWorldMotion();
}
function touchVector(e){
 const box=touchStick.getBoundingClientRect(),r=Math.min(box.width,box.height)*.34;
 const dx=e.clientX-(box.left+box.width/2),dy=e.clientY-(box.top+box.height/2),distance=Math.hypot(dx,dy);
 const power=Math.min(1,distance/r),magnitude=power<.12?0:(power-.12)/.88;
 touchMotion.x=distance?dx/distance*magnitude:0;touchMotion.y=distance?dy/distance*magnitude:0;
 const thumbX=distance?dx/distance*power*r:0,thumbY=distance?dy/distance*power*r:0;
 stickThumb.style.setProperty('--stick-x',`${thumbX.toFixed(1)}px`);stickThumb.style.setProperty('--stick-y',`${thumbY.toFixed(1)}px`);
}
function touchFrame(now){if(touchMotion.pointerId===null||page!=='world'||!state.onboarded||state.pending||document.querySelector('.modal-backdrop')){stopTouchWalking();return;}
 const seconds=touchMotion.last?Math.min(.05,(now-touchMotion.last)/1000):0;touchMotion.last=now;
 if(seconds){const magnitude=Math.hypot(touchMotion.x,touchMotion.y),speed=2.0+2.1*magnitude;
  if(magnitude>.05)performStep(touchMotion.x*speed*seconds,touchMotion.y*speed*seconds,true);
 }
 touchMotion.raf=requestAnimationFrame(touchFrame);
}
touchStick?.addEventListener('pointerdown',e=>{
 if(touchMotion.pointerId!==null||page!=='world'||!state.onboarded||document.querySelector('.modal-backdrop'))return;
 e.preventDefault();stopWalking();stopHeld();touchMotion.pointerId=e.pointerId;touchStick.classList.add('steering');touchStick.setPointerCapture(e.pointerId);touchVector(e);
 touchMotion.last=0;touchMotion.raf=requestAnimationFrame(touchFrame);
});
touchStick?.addEventListener('pointermove',e=>{if(touchMotion.pointerId===e.pointerId){e.preventDefault();touchVector(e);}});
for(const name of ['pointerup','pointercancel','lostpointercapture'])touchStick?.addEventListener(name,e=>{if(touchMotion.pointerId===e.pointerId)stopTouchWalking();});
document.getElementById('touch-interact')?.addEventListener('click',()=>{stopTouchWalking();talkOrInspect();});

  m.pearl=Math.floor(Math.random()*3);m.lanes=[0,1,2];m.phase='preview';renderMini();const session=m.session;
  queueMini(()=>{if(challengeState?.session!==session)return;m.phase='shuffling';renderMini();},1100);
  for(let n=0;n<3+m.round;n++)queueMini(()=>{if(challengeState?.session!==session)return;let a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;[m.lanes[a],m.lanes[b]]=[m.lanes[b],m.lanes[a]];renderShellPosition();},1600+n*680);
  queueMini(()=>{if(challengeState?.session===session){m.phase='playing';renderMini();}},1800+(3+m.round)*680);
 }else if(m.id==='moon'){
  m.starPath=STAR_PATHS[m.round];m.phase='playing';renderMini();
 }
}
function miniStatus(m){return `<div class="mini-score"><span>Round <strong>${Math.min(m.round+1,3)} / 3</strong></span><span>Golden ribbons <strong>${'✦'.repeat(m.score)}${'·'.repeat(3-m.score)}</strong></span></div>`;}
function miniContent(m){const id=m.id;
 if(m.phase==='ready')return `<div class="mini-intro-hero">${MINI_INFO[id].icon}</div><p>${safe(MINI_INFO[id].how)}</p><button class="btn" data-action="mini-start"><kbd>Enter</kbd> Start playing →</button>`;
 if(m.phase==='done')return `<div class="mini-intro-hero">${m.score===3?'🏅':m.score?'🎀':'💛'}</div><h3>${m.score===3?'Perfect little performance!':m.score?'What a lovely effort!':'A little more practice?'}</h3><p>${m.score} of 3 golden ribbons. ${m.score===3?'You earned the gold-ribbon bonus!':'You can try again anytime.'}</p><button class="btn" data-action="mini-finish">Collect rewards →</button>`;
 if(id==='baker'||id==='sports')return `<div class="mini-target-head">${id==='baker'?'🔥 Watch the oven!':'🎾 Aim for the center!'}<span class="tiny muted">${m.phase==='feedback'?'Good try!':'Tap at the right time'}</span></div>
 <div class="mini-timing-track ${id==='baker'?'oven-track':'sports-track'}" role="img" aria-label="Moving timing needle with target area"><div class="mini-perfect-range" style="left:${(m.target-.095)*100}%;width:19%"></div><div class="mini-bullseye" style="left:${m.target*100}%"></div><div class="mini-timing-needle" id="mini-needle" style="left:${m.position*100}%">${id==='baker'?'🥐':'🎾'}</div></div>
 <button class="btn mini-main-action" data-action="mini-hit" ${m.phase!=='playing'?'disabled':''}><kbd>Space</kbd> ${id==='baker'?'Take out the tray!':'Take the shot!'}</button>`;
 if(id==='garden')return `<p>${m.phase==='preview'?'Watch the flowers carefully. Your turn is coming!':'Repeat the glowing flower pattern.'}</p><div class="flower-grid">${MINI_FLOWERS.map((f,i)=>`<button class="flower-key" data-action="mini-flower" data-flower="${i}" ${m.phase!=='playing'?'disabled':''}><span>${f}</span><small><kbd>${i+1}</kbd> Flower ${i+1}</small></button>`).join('')}</div><p class="mini-feedback" aria-live="polite">${m.phase==='preview'?'Remember the sequence…':`${m.entered.length} of ${m.sequence.length} flowers recalled`}</p>`;
 if(id==='wood')return `<h3>Find this treasure: <span class="mini-big-icon">${m.target}</span></h3><div class="forage-grid">${m.choices.map((f,i)=>`<button class="forage-tile" data-action="mini-forage" data-index="${i}" aria-label="Woodland object ${i+1}: ${f}" ${m.phase!=='playing'?'disabled':''}>${f}</button>`).join('')}</div><p class="mini-feedback">Choose the matching item from the forest floor.</p>`;
 if(id==='sea')return `<p class="mini-feedback">${m.phase==='preview'?'The pearl glows under one shell. Watch it!':m.phase==='shuffling'?'The shells are swapping places…':'Which shell hides the pearl?'}</p><div class="shell-stage">${[0,1,2].map(i=>`<button class="shell-cup" data-shell="${i}" data-action="mini-shell" ${m.phase!=='playing'?'disabled':''} style="left:${m.lanes[i]*33.333+16.667}%"><span>🐚</span><small>${m.phase==='preview'&&m.pearl===i?'💎':'?'}</small></button>`).join('')}</div>`;
 if(id==='moon'){
  const joined=m.starPath.slice(0,m.index).map(i=>`${STARS[i].x},${STARS[i].y}`).join(' ');
  const goal=m.starPath.map(i=>STARS[i].name).join(' → ');
  return `<p class="mini-feedback">Connect in this order: <strong>${safe(goal)}</strong></p><svg class="constellation-field" viewBox="0 0 100 100" role="img" aria-label="Five labeled stars to connect">${m.index>=2?`<polyline points="${joined}" fill="none" stroke="#fae6a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`:''}${STARS.map((star,i)=>`<g class="star-node ${m.starPath.slice(0,m.index).includes(i)?'connected':''}" data-star="${i}"><circle cx="${star.x}" cy="${star.y}" r="6.5" fill="#fcf4d9" stroke="#7e68ac" stroke-width="1"/><text x="${star.x}" y="${star.y+1.4}" text-anchor="middle" font-size="5">✦</text><text x="${star.x}" y="${star.y+10}" text-anchor="middle" font-size="4.2">${star.name}</text></g>`).join('')}</svg><div class="star-choices">${STARS.map((star,i)=>`<button class="btn micro cream" data-action="mini-star" data-index="${i}" ${m.phase!=='playing'?'disabled':''}>${safe(star.name)}</button>`).join('')}</div><p class="tiny muted">${m.index} of ${m.starPath.length} stars connected</p>`;
 }
 return '';
}
function renderMini(){const m=challengeState;if(!m)return;let div=$('#challenge-modal');if(!div){div=el('div','modal-backdrop');div.id='challenge-modal';document.body.append(div);}
 const data=MINI_INFO[m.id];div.innerHTML=`<section class="modal mini-modal skill-modal" role="dialog" aria-modal="true" aria-label="${safe(data.title)}"><div class="row between"><span class="eyebrow">Softlands activity · ${safe(data.subtitle)}</span><button data-action="close-challenge" class="btn micro cream" aria-label="Leave activity">✕ Leave</button></div><h2>${safe(data.title)}</h2>${miniStatus(m)}<div class="skill-play-area">${miniContent(m)}</div><p class="tiny muted mt-12">${m.phase==='ready'?'Play on desktop or touch. All activities have keyboard controls.':'Your best result is kept in your adventure journal.'}</p></section>`;
 div.querySelector('[data-action="mini-start"], .mini-main-action, .flower-key:not(:disabled), [data-action="mini-finish"]')?.focus({preventScroll:true});}
function animateMiniNeedle(){if(!challengeState||!['baker','sports'].includes(challengeState.id))return;const session=challengeState.session;
 const frame=now=>{const m=challengeState;if(!m||m.session!==session||m.phase!=='playing')return;
  m.position=(1-Math.cos((now-m.started)/m.duration*Math.PI*2))/2;
  const needle=$('#mini-needle');if(needle)needle.style.left=(m.position*100).toFixed(1)+'%';miniFrame=requestAnimationFrame(frame);
 };miniFrame=requestAnimationFrame(frame);
}
function renderShellPosition(){const m=challengeState;if(!m)return;for(let i=0;i<3;i++){const shell=$(`[data-shell="${i}"]`);if(shell)shell.style.left=`${m.lanes[i]*33.333+16.667}%`;}}
function miniAdvance(success,message=''){const m=challengeState;if(!m||m.phase==='feedback')return;m.score+=success?1:0;m.phase='feedback';clearMiniTimers();renderMini();const content=$('.skill-play-area');if(content){const feedback=el('div','mini-result-feedback',`${success?'✦ Golden ribbon!':'♡ Not this time.'} ${message}`);content.append(feedback);}const session=m.session;
 queueMini(()=>{if(challengeState?.session!==session)return;m.round++;if(m.round>=3){m.phase='done';renderMini();}else nextMiniRound();},1150);
}
function miniAct(type,val){const m=challengeState;if(!m)return;
 if(type==='mini-start'){startMini();return;}
 if(type==='mini-finish'){finishMini();return;}
 if(m.phase!=='playing')return;
 if(type==='mini-hit'&&['baker','sports'].includes(m.id)){const error=Math.abs(m.position-m.target);miniAdvance(error<.155,error<.075?'Perfect center!':error<.155?'Beautiful timing!':'The timing was a little off.');return;}
 if(type==='mini-flower'&&m.id==='garden'){
  const i=Number(val);m.entered.push(i);if(i!==m.sequence[m.entered.length-1])miniAdvance(false,'The flowers need a different order.');else if(m.entered.length===m.sequence.length)miniAdvance(true,'You remembered every flower!');else renderMini();return;
 }
 if(type==='mini-forage'&&m.id==='wood'){miniAdvance(Number(val)===m.answer,'Bo has a basket ready for your finds.');return;}
 if(type==='mini-shell'&&m.id==='sea'){miniAdvance(m.lanes[Number(val)]===m.lanes[m.pearl],'Captain Larry lifts the shell…');return;}
 if(type==='mini-star'&&m.id==='moon'){
  if(Number(val)!==m.starPath[m.index]){miniAdvance(false,'A little star wandered off the trail.');return;}
  m.index++;if(m.index===m.starPath.length)miniAdvance(true,'You drew a shining constellation!');else renderMini();return;
 }
}
function finishMini(){const m=challengeState;if(!m)return;const {id,score}=m;miniClose();ensureWorld(state);
 const result=saveMiniScore(state,id,score,grantXp,completeChallenge);persist();render();
 const reward=result.firstClear?'You earned 2 stars and experience for your team. ':'';
 const gold=result.gold?'You also earned the bonus gold-ribbon star. ':'';
 const note=score===0?'No ribbons this time, but you can play again!':`You collected ${score} of 3 golden ribbons. `;
 showMilestone(score===3?'Gold-ribbon masterpiece!':score?'A little victory!':'Practice makes plush-perfect',note+reward+gold+(result.firstClear&&state.world.completed.length%3===0?'A mystery jar has been added to your collection!':''));
}


// Initialize the interface after all keyboard handlers are registered.
render();

</script>
