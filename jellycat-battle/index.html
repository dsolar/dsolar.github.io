 const div=el('div','modal-backdrop');div.id='talk-modal';div.innerHTML=`<section class="modal talk-modal" role="dialog" aria-modal="true" aria-label="Talking with ${safe(n.name)}"><div class="row between"><span class="eyebrow">${safe(ZONES.find(z=>z.id===zoneAt(n.x,n.y))?.name||'The Softlands')}</span><button class="btn micro cream" data-action="close-talk">✕ Close</button></div><div class="talk-portrait">${plushArt(plush)}</div><h2>${safe(n.name)}</h2><p class="dialogue-line">“${safe(n.say)}”</p><div class="row">${n.challenge?`<button class="btn" data-action="begin-challenge" data-id="${safe(n.challenge)}">${completed?'Play again':'Play a little game'} →</button>`:''}<button class="btn cream" data-action="close-talk">${n.challenge?'Maybe later':'Thanks for the tip!'}</button></div>${completed?'<p class="tiny muted mt-12">✓ You already earned this friend’s one-time reward.</p>':''}</section>`;document.body.append(div);div.querySelector('button')?.focus();}
function showChallenge(id){if(!CHALLENGES[id])return;$('#talk-modal')?.remove();challengeState={id,index:0,mistakes:0};renderChallenge();}
function renderChallenge(){if(!challengeState)return;const {id,index}=challengeState,c=CHALLENGES[id],step=c.steps[index];let div=$('#challenge-modal');if(!div){div=el('div','modal-backdrop');div.id='challenge-modal';document.body.append(div)}
 div.innerHTML=`<section class="modal mini-modal" role="dialog" aria-modal="true" aria-label="${safe(c.title)}"><div class="row between"><span class="eyebrow">Tiny adventure · Round ${index+1} / ${c.steps.length}</span><button data-action="close-challenge" class="btn micro cream">✕</button></div><div class="mini-sparkle">✿ ✦ ✿</div><h2>${safe(c.title)}</h2><p>${safe(step.question)}</p><div class="mini-options">${step.answers.map((answer,i)=>`<button class="btn cream" data-action="answer" data-index="${i}">${safe(answer)}</button>`).join('')}</div><p class="small muted mt-12">${challengeState.mistakes?'Try another answer. You can keep going!':'Choose the answer you think is right.'}</p></section>`;
 div.querySelector('.mini-options button')?.focus();}
function answerChallenge(i){if(!challengeState)return;const c=CHALLENGES[challengeState.id],step=c.steps[challengeState.index];if(i!==step.correct){challengeState.mistakes++;notify('Not quite! Try another idea.');renderChallenge();return;}
 challengeState.index++;if(challengeState.index<c.steps.length){renderChallenge();return;}
 const id=challengeState.id;challengeState=null;$('#challenge-modal')?.remove();const fresh=completeChallenge(state,id);persist();render();showMilestone(fresh?'Brilliant! +2 ★': 'You did it again!',fresh?'This little adventure earned two stars. Three different activities also earn a special mystery jar.':'You have already collected this adventure’s reward.');}
function showMilestone(title,desc){const div=el('div','modal-backdrop');div.id='milestone-modal';div.innerHTML=`<section class="modal center" role="dialog" aria-modal="true" aria-label="Discovery"><div class="giant-star">✦</div><h2>${safe(title)}</h2><p>${safe(desc)}</p><button class="btn" data-action="close-milestone">Keep exploring →</button></section>`;document.body.append(div);}
function showFound(t){showMilestone(`You found ${t.title}!`,`${t.text} You earned ${t.points} star.`);}
function talkOrInspect(){ensureWorld(state);const npc=nearbyNpcs(state.world)[0],parlor=nearbyParlor(state.world);
 if(npc){showTalk(npc);return;}if(parlor){showParlor(parlor);return;}notify('Walk closer to a plush friend or a Parlor, or explore tall grass!');}
function showKeyboardHelp(){if($('#keyboard-modal'))return;const div=el('div','modal-backdrop');div.id='keyboard-modal';div.innerHTML=`<section class="modal help-modal" role="dialog" aria-modal="true" aria-label="Keyboard controls"><span class="eyebrow">Play without your mouse</span><h2>Keyboard controls</h2><dl class="shortcut-grid"><dt><kbd>W A S D</kbd> / arrows</dt><dd>Walk. Hold to keep walking.</dd><dt><kbd>E</kbd> / <kbd>Space</kbd></dt><dd>Talk or inspect what's nearby.</dd><dt><kbd>P</kbd></dt><dd>Talk to a nearby Parlor Keeper.</dd><dt><kbd>G</kbd> <kbd>T</kbd> <kbd>C</kbd> <kbd>H</kbd></dt><dd>Explore, Team, Collection, Clubhouse.</dd><dt><kbd>V</kbd></dt><dd>Resume an active battle.</dd><dt><kbd>1</kbd>–<kbd>3</kbd> in battle</dt><dd>Use a move. <kbd>4</kbd>–<kbd>6</kbd> switches friends.</dd><dt><kbd>1</kbd>–<kbd>3</kbd> at rewards</dt><dd>Choose a gift-bag friend.</dd><dt><kbd>Shift</kbd> + <kbd>1</kbd>–<kbd>8</kbd></dt><dd>Walk to a district.</dd><dt><kbd>J</kbd></dt><dd>Open an earned mystery jar from Team.</dd><dt><kbd>/</kbd></dt><dd>Search your Collection.</dd><dt><kbd>Tab</kbd>, <kbd>Enter</kbd></dt><dd>Reach and activate any button or form.</dd><dt><kbd>Esc</kbd></dt><dd>Close dialogs.</dd></dl><button class="btn" data-action="close-help">Got it! <kbd>Esc</kbd></button></section>`;document.body.append(div);div.querySelector('button')?.focus();}

// Keyboard controls work on every screen, including the modal questions and claim panels.
const pressed=new Set();let walkHeldTimer=null;
function stopHeld(){clearInterval(walkHeldTimer);walkHeldTimer=null;pressed.clear();}
function walkKey(){const keys=[['arrowup',0,-1],['w',0,-1],['arrowdown',0,1],['s',0,1],['arrowleft',-1,0],['a',-1,0],['arrowright',1,0],['d',1,0]];for(const [k,dx,dy] of keys)if(pressed.has(k))return [dx,dy];return null;}
function doHeldMove(){const dir=walkKey();if(!dir||document.querySelector('.modal-backdrop')||page!=='world'){stopHeld();return;}stopWalking();performStep(dir[0]*WALK_INCREMENT,dir[1]*WALK_INCREMENT,true);}
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const key=e.key.toLowerCase(),input=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
 const modal=document.querySelector('.modal-backdrop');
 if(modal){if(e.key==='Escape')return;
  if(input)return;
  if(key==='enter'&&document.activeElement?.tagName==='BUTTON')return;
  const question=modal.querySelector('.mini-options');
  if(/^[1-9]$/.test(key)){const buttons=[...(question?.querySelectorAll('button:not(:disabled)')||modal.querySelectorAll('button:not(:disabled)'))];const btn=buttons[Number(key)-1];if(btn){e.preventDefault();btn.click();}return;}
  if(key==='enter'){const primary=modal.querySelector('.btn:not(.cream):not(:disabled)');if(primary){e.preventDefault();primary.click();}}return;
 }
 if(input)return;
 if(key==='?'||(key==='/'&&e.shiftKey)){e.preventDefault();showKeyboardHelp();return;}
 if(page==='world'&&state.onboarded&&['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(key)){
  e.preventDefault();if(!pressed.has(key)){pressed.add(key);doHeldMove();if(!walkHeldTimer)walkHeldTimer=setInterval(doHeldMove,65);}return;
 }
 if(page==='world'&&e.shiftKey&&/^[1-8]$/.test(key)){e.preventDefault();const z=ZONES[Number(key)-1];walkToward(z.x,z.y);return;}
 if(page==='world'&&['e',' ','enter'].includes(key)&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();talkOrInspect();return;}
 if(page==='world'&&key==='p'){e.preventDefault();const pl=nearbyParlor(state.world);if(pl)showParlor(pl);else notify('No Parlor nearby. Follow the ✿ signs!');return;}
 if(page==='battle'&&state.battle&&/^[1-6]$/.test(key)){
  e.preventDefault();const n=Number(key);const btn=document.querySelector(n<=3?`[data-action="move"][data-index="${n-1}"]`:`[data-action="switch"][data-index="${n-4}"]`);if(btn&&!btn.disabled)btn.click();return;
 }
 if(state.pending){if(!bagOpen&&key==='enter'){$('[data-action="open-bag"]')?.click();e.preventDefault();return;}if(bagOpen&&/^[1-3]$/.test(key)){e.preventDefault();document.querySelectorAll('[data-action="claim"]')[Number(key)-1]?.click();return;}}
 if(page==='home'&&key==='j'&&state.jars){e.preventDefault();$('[data-action="jar"]')?.click();return;}
 if(page==='collection'&&key==='/'){e.preventDefault();$('#filter-query')?.focus();return;}
 if(page==='clubhouse'&&['e','i','r'].includes(key)){const a={e:'export',i:'import',r:'reset'}[key];$(`[data-action="${a}"]`)?.click();e.preventDefault();return;}
 if(!state.onboarded||state.pending)return;
 if(!e.shiftKey&&['g','t','c','h','v'].includes(key)){const p={g:'world',t:'home',c:'collection',h:'clubhouse',v:'battle'}[key];if(p!=='battle'||state.battle){e.preventDefault();go(p);}return;}
 if(/^[1-5]$/.test(key)&&!e.shiftKey){const pages=['world','home','collection','clubhouse','battle'];const selected=pages[Number(key)-1];if(selected==='battle'&&!state.battle)return;e.preventDefault();go(selected);}
});
document.addEventListener('keyup',e=>{pressed.delete(e.key.toLowerCase());if(!walkKey())stopHeld();});window.addEventListener('blur',stopHeld);
document.addEventListener('pointerdown',e=>{const btn=e.target.closest('.dpad [data-action="step"]');if(!btn)return;const dx=Number(btn.dataset.dx),dy=Number(btn.dataset.dy);stopHeld();stopWalking();performStep(dx*WALK_INCREMENT,dy*WALK_INCREMENT);if(walkHeldTimer)clearInterval(walkHeldTimer);walkHeldTimer=setInterval(()=>performStep(dx*WALK_INCREMENT,dy*WALK_INCREMENT,true),70);btn.dataset.held='1';});
document.addEventListener('pointerup',e=>{if(walkHeldTimer){clearInterval(walkHeldTimer);walkHeldTimer=null;}});
document.addEventListener('click',e=>{const btn=e.target.closest('.dpad [data-action="step"]');if(btn&&btn.dataset.held==='1'){btn.dataset.held='0';e.stopImmediatePropagation();e.preventDefault();}},true);


// v0.6: A stable, analog-feeling touch joystick that survives map refreshes.
const touchStick=document.getElementById('touch-stick'),stickThumb=document.getElementById('stick-thumb');
const touchMotion={pointerId:null,x:0,y:0,last:0,raf:0};
function stopTouchWalking(){
 if(touchMotion.raf)cancelAnimationFrame(touchMotion.raf);
 touchMotion.raf=0;touchMotion.last=0;touchMotion.pointerId=null;touchMotion.x=0;touchMotion.y=0;
 touchStick?.classList.remove('steering');if(stickThumb){stickThumb.style.setProperty('--stick-x','0px');stickThumb.style.setProperty('--stick-y','0px');}
 finishWorldMotion();
}
function touchVector(e){
 const box=touchStick.getBoundingClientRect(),r=Math.min(box.width,box.height)*.34;
 const dx=e.clientX-(box.left+box.width/2),dy=e.clientY-(box.top+box.height/2),distance=Math.hypot(dx,dy);
 const power=Math.min(1,distance/r),magnitude=power<.12?0:(power-.12)/.88;
 touchMotion.x=distance?dx/distance*magnitude:0;touchMotion.y=distance?dy/distance*magnitude:0;
 const thumbX=distance?dx/distance*power*r:0,thumbY=distance?dy/distance*power*r:0;
 stickThumb.style.setProperty('--stick-x',`${thumbX.toFixed(1)}px`);stickThumb.style.setProperty('--stick-y',`${thumbY.toFixed(1)}px`);
}
function touchFrame(now){if(touchMotion.pointerId===null||page!=='world'||!state.onboarded||state.pending||document.querySelector('.modal-backdrop')){stopTouchWalking();return;}
 const seconds=touchMotion.last?Math.min(.05,(now-touchMotion.last)/1000):0;touchMotion.last=now;
 if(seconds){const magnitude=Math.hypot(touchMotion.x,touchMotion.y),speed=2.0+2.1*magnitude;
  if(magnitude>.05)performStep(touchMotion.x*speed*seconds,touchMotion.y*speed*seconds,true);
 }
 touchMotion.raf=requestAnimationFrame(touchFrame);
}
touchStick?.addEventListener('pointerdown',e=>{
 if(touchMotion.pointerId!==null||page!=='world'||!state.onboarded||document.querySelector('.modal-backdrop'))return;
 e.preventDefault();stopWalking();stopHeld();touchMotion.pointerId=e.pointerId;touchStick.classList.add('steering');touchStick.setPointerCapture(e.pointerId);touchVector(e);
 touchMotion.last=0;touchMotion.raf=requestAnimationFrame(touchFrame);
});
touchStick?.addEventListener('pointermove',e=>{if(touchMotion.pointerId===e.pointerId){e.preventDefault();touchVector(e);}});
for(const name of ['pointerup','pointercancel','lostpointercapture'])touchStick?.addEventListener(name,e=>{if(touchMotion.pointerId===e.pointerId)stopTouchWalking();});
document.getElementById('touch-interact')?.addEventListener('click',()=>{stopTouchWalking();talkOrInspect();});
window.addEventListener('blur',stopTouchWalking);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTouchWalking();});
window.addEventListener('resize',()=>{if(page==='world'&&state.onboarded&&!state.pending)render();});
window.addEventListener('pagehide',finishWorldMotion);

// Initialize the interface after all keyboard handlers are registered.
render();

</script>
