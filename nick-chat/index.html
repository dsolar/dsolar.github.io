<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat with Nick | David Solar</title><link rel="canonical" href="https://davidsolar.dev/nick-chat/"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><script src="../assets/analytics.js" defer></script><meta name="description" content="A simple Nick-inspired chat prototype."><meta name="theme-color" content="#ffffff"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24262b;background:#f7f7f8}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #596bc1;outline-offset:3px}.app{max-width:800px;margin:auto;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;border-left:1px solid #ececef;border-right:1px solid #ececef}.home-link{font-size:12px;color:#777c85;text-decoration:none;display:inline-block;margin-bottom:12px}.home-link:hover{text-decoration:underline}header{padding:22px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ececef;gap:18px}h1{font-size:19px;font-weight:650;letter-spacing:-.4px;margin:0}header p{font-size:12px;color:#777c85;margin:5px 0 0}.reset{background:white;border:1px solid #dedfe4;border-radius:8px;padding:9px 13px;font-size:12px;color:#50545e}.reset:hover{background:#f6f6f8}.messages{flex:1;overflow-y:auto;padding:28px;scroll-behavior:smooth}.day{text-align:center;font-size:11px;color:#9498a0;margin:0 0 30px}.row{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:24px}.row.user{align-items:flex-end}.bubble{background:#f1f2f4;border-radius:14px 14px 14px 4px;padding:12px 16px;max-width:85%;font-size:15px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.user .bubble{background:#eef0fa;border-radius:14px 14px 4px 14px;color:#30384f}.sender{font-size:11px;color:#848892;margin:0 3px 7px}.compose{padding:15px 24px 18px;border-top:1px solid #eeeef1}form{display:flex;align-items:center;gap:10px;border:1px solid #dcdde3;border-radius:12px;padding:7px 7px 7px 14px;background:white}form:focus-within{border-color:#8993b7;box-shadow:0 0 0 2px #eef0f7}input{min-width:0;width:100%;background:transparent;border:0;padding:10px 0;color:#24262b;font-size:16px}input:focus-visible{outline:none}input::placeholder{color:#969ba5}.send{background:#3037
