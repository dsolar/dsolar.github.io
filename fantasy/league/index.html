<script>
/* This page lives at a clean Draft Lab address, and its files at /fantasy-kit/ (the <base> above). A link to "#..."
   would resolve against the base and leave the page, so one the app didn't handle itself is kept here. */
window.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target) return;
  e.preventDefault();
  var h = a.getAttribute("href");
  if (h.length > 1 && location.hash !== h) location.hash = h;
});
</script>
