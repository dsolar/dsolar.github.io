<style>
.hero{padding:26px 0 6px}
.hero h1{margin:0;font-size:clamp(40px,7vw,84px)}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:12px 0 18px}
.narrow{max-width:520px}
.form .bd{display:grid;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lgl{display:grid;gap:8px}
.lgc{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit}
.lgc b{display:block;font-size:17px}
.lgc small{color:var(--muted)}
.lgc:hover{border-color:var(--line-2)}
.lgc .grow{display:grid;gap:2px;min-width:0}
.lgstat{display:grid;justify-items:end;line-height:1.1;padding:0 6px}
.lgstat b{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}
.lgstat small{font-size:11.5px;white-space:nowrap}
.lgstat.live b{color:var(--loss)}
.lgbar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px;max-width:260px}
.lgbar i{display:block;height:100%;background:var(--accent)}
@media (max-width:420px){.lgc{flex-wrap:wrap}.lgc .grow{flex:1 1 calc(100% - 60px)}.lgstat{order:3;justify-items:start;padding:0 0 0 54px;grid-auto-flow:column;gap:6px;align-items:baseline}.lgstat b{font-size:17px}.lgc>.btn{order:4;margin-left:auto}}
.seats{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.seats label{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;background:var(--field);cursor:pointer}
.seats label.taken{opacity:.6;cursor:default;background:var(--surface-2)}
.seats label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.seats span{display:grid;min-width:0}
.seats small{color:var(--muted)}

</style>

<link rel="stylesheet" href="../assets/navigation.css?v=20261112">

</head>
<body>
<nav class="ds-bar ds-navigation" data-ds-navigation aria-label="Main">
  <a class="ds-brand" href="../" aria-label="David Solar, home"><img src="../assets/nav-mark.svg" alt="" width="38" height="38"><span>David Solar</span></a>
  <a href="../fantasy/">← Fantasy</a>
  <a href="../#projects">Explore all projects</a>
</nav>
<!-- The header, drawn before the scripts arrive: what leagues.js draws (header()). The page under it depends on who's
     signed in, so it waits for leagues.js. Keep the header in step. -->
<header class="fk-top" id="top"><div class="fk-mast fk-band"><div class="wrap">
        <a class="fk-brand" href="./"><img src="mark.svg" alt=""><b class="disp">Draft Lab</b></a>
        <span class="grow"></span><div class="fk-who"><button class="btn sm ghost" data-theme="">Dark</button></div></div></div>
      <div class="fk-nav"><div class="wrap"><nav aria-label="Sections"><a href="leagues.html" aria-current="page">Your leagues</a><a href="week.html">Quick games</a><a href="./#draft">Mock draft</a><a href="./#rankings">Rankings</a><a href="league.html">Demo league</a></nav></div></div>
</header>
<main id="app"><div class="wrap" style="padding:80px 16px;color:var(--muted)">Loading…</div></main>
<script>
(function () {
  try {
    var top = document.getElementById("top"), q = new URLSearchParams(location.search);
    if (q.get("w") === "1") { top.querySelector("[aria-current]").removeAttribute("aria-current"); top.querySelector('a[href="week.html"]').setAttribute("aria-current", "page"); }
    if (localStorage.getItem("fk-auth:session")) top.querySelector(".fk-who").insertAdjacentHTML("afterbegin", '<button class="btn sm ghost" data-a="out">Sign out</button>');
    if (document.documentElement.dataset.theme === "dark") top.querySelector("[data-theme]").textContent = "Light";
  } catch (e) { /* leagues.js draws the header either way */ }
})();
</script>
<script>
/* The app's scripts, run in this order. Loaded from here rather than as <script src> tags so they start once the
   stylesheets are in (an inline script waits for them): the first screen above paints without the JavaScript
   sharing the connection with kit.css. Bump a file's ?v= here when it changes. */
["sports.js?v=20261113zd", "value.js?v=20261111d", "draft.js?v=20261111e", "../assets/faces.js?v=20261109c", "ui.js?v=20261113zd", "setup.js?v=20261113", "cloud.js?v=20261112b", "slates.js?v=20261111d", "leagues.js?v=20261113"].forEach(function (src) { var s = document.createElement("script"); s.src = src; s.async = false; document.body.appendChild(s); });
</script>
</body>
</html>
