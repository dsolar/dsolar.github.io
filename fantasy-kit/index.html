<style>
/* Draft Lab is the Fantasy Kit with its default brand: stadium navy and scoreboard amber. */
.setup{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:18px;align-items:start}
.setup .form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hero{padding:26px 0 6px}
.hero h1{margin:0;font-size:clamp(40px,7vw,84px)}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:12px 0 0}
.sports{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sports label{position:relative;cursor:pointer}
.sports input{position:absolute;opacity:0;pointer-events:none}
.sports span{display:grid;gap:2px;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--field)}
.sports b{font-size:22px}
.sports small{color:var(--muted);font-size:12.5px}
.sports input:checked+span{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--brand-soft)}
.sports input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:600px){.lb{grid-template-columns:1fr}.row2:has(#s-trades){grid-template-columns:1fr}}
.code{font:600 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;white-space:pre}
.doc h2{font-size:22px;margin:4px 0 8px}
.doc p,.doc li{max-width:72ch}
.doc ul{padding-left:20px}
body.fk-room .ds-bar{display:none}
@media (max-width:980px){.setup{grid-template-columns:1fr}}
/* the mock setup (FK.setup controls, styled in kit.css) */
.mk-resume{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.mk-resume:hover{border-color:var(--muted)}
.mk-resume span:first-child{display:grid;gap:1px;flex:1;min-width:0}
.mk-resume b{font-size:15px}
.mk-resume small{font-size:12.5px;color:var(--muted)}

@media (max-width:600px){.row2,.row3{grid-template-columns:1fr 1fr}.sports b{font-size:16px}.sports span{padding:10px}.sports small{display:none}}
@media (max-width:420px){.sports b{font-size:14.5px}.sports span{padding:10px 8px}.row2,.row3{grid-template-columns:1fr}}
.kit-band{background:linear-gradient(120deg,#1B3150,#0E1A2C)}
.kit-band .nl-bi{max-width:760px}
.kit-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.kit-f{font:700 13.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.kit-cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;margin-top:22px}
.kit-p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.kit-p code,.kit-tok code{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.kit-tok{display:grid;gap:8px}
.kit-tok>div{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.kit-tok .sw{width:28px;height:28px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.kit-tok span:last-child{display:grid;gap:1px}
.kit-tok small{font-size:12.5px;color:var(--muted)}
.kit-data{display:grid;gap:8px}
.kit>.nl-sec{margin-top:22px}
.kit .nl-sec+.nl-sec{margin-top:22px}
.kit .kit-cols .nl-sec+.nl-sec{margin-top:0}
@media (max-width:860px){.kit-cols{grid-template-columns:1fr}}
</style>
