<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Hard Cap. A front office at night: deep court greens, warm white type, and Cap Lime for value and room under
   the line. Gold warns, red is only for illegal moves, expiring clocks and anything over the line. The cap bar is
   the signature: every contract a block, stacked toward a hard line. Display type is Archivo at its heaviest,
   condensed and italic; everything else is plain Archivo with tabular numbers. */
/* Readable first: a light page by default with dark ink, and the brand kept in the masthead and the Draft Room
   clock, which stay deep court green with Cap Lime. Lime is a fill, never text on light. A dark mode is one tap away. */
:root{
  --court:#EEF2EF; --office:#FFFFFF; --ledger:#E4EBE6; --ledger-2:#D7E1DA; --line:#CFD9D2; --line-2:#AFC0B4; --field:#FFFFFF;
  --ink:#0D1D18; --muted:#4A5E54; --dim:#6A7D72;
  --lime:#C9FF4A; --lime-ink:#0A1A06; --lime-soft:rgba(150,210,30,.2); --pos:#2C7A0B; --accent:#6FA800;
  --gold:#9A5B00; --gold-soft:#FFEFD1; --orange:#B5521B; --orange-soft:#FDE7DA; --red:#C42536; --red-soft:#FCE3E6;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:6px; --gut:16px;
  color-scheme:light;
}
/* Dark mode sits on neutral charcoal, not green-black: greys carry the surfaces, and green is kept for meaning
   (room, wins, value) at a softer, readable tint. */
:root[data-theme="dark"]{
  --court:#141619; --office:#1C1F23; --ledger:#24282D; --ledger-2:#2D3238; --line:#33383F; --line-2:#474E57; --field:#111316;
  --ink:#ECEEF1; --muted:#A7AEB7; --dim:#848C96;
  --lime-soft:rgba(150,214,80,.14); --pos:#9BDA5E; --accent:#9BDA5E;
  --gold:#F2B654; --gold-soft:rgba(242,182,84,.15); --orange:#F59A6E; --orange-soft:rgba(245,154,110,.16); --red:#FF7F8A; --red-soft:rgba(255,127,138,.15);
  color-scheme:dark;
}
/* The brand band is always dark, whatever the theme. */
.mast,.clock{--ink:#F2F4F3; --muted:#B4C2BA; --dim:#8D9C94; --pos:#C9FF4A; --accent:#C9FF4A; --line:#2A3B33; --line-2:#3A4E44; --ledger:#1A2C25; --office:#13241E; --red:#FF7F8A;
  background:#10201A; color:var(--ink)}
:root[data-theme="dark"] .mast,:root[data-theme="dark"] .clock{background:#0F1113;--ledger:#1E2226;--office:#17191C;--line:#2B2F34;--line-2:#3D434A;--muted:#AAB1B9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--court)}
body{margin:0;background:var(--court);color:var(--ink);font:400 15px/1.5 var(--f)}
button,input,select{font:inherit;color:inherit}
a{color:var(--pos)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.disp{font-weight:900;font-style:italic;font-variation-settings:"wdth" 64;letter-spacing:-.01em;line-height:.95}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}

/* masthead */
.top{position:sticky;top:0;z-index:40}
.mast{padding-top:env(safe-area-inset-top,0px)}
.mast-top{display:flex;align-items:center;gap:12px;min-height:56px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:34px;height:34px;display:block}
.brand b{font-size:24px}
.mast .lg{color:var(--muted);font-size:14px;font-weight:600}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ledger);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.chip b{color:var(--pos)}
/* Section tabs on their own bar, Yahoo-style, with the pages of that section on a second bar underneath. */
.navbar{background:var(--office);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}
.tabs a{display:block;padding:11px 16px 9px;color:var(--muted);text-decoration:none;font-weight:800;font-size:14.5px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink);background:var(--ledger)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs{background:var(--ledger);border-bottom:1px solid var(--line)}
.subtabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:6px;padding-bottom:6px}
.subtabs a{display:block;padding:4px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
.subtabs a:hover{color:var(--ink);background:var(--ledger-2)}
.subtabs a[aria-current="page"]{background:var(--ink);color:var(--office)}
/* league menu */
.switch{position:relative}
.switch summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;font-weight:700;font-size:14px;max-width:46vw}
.switch summary::-webkit-details-marker{display:none}
.switch summary:hover{border-color:var(--muted)}
.sw-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);flex:none}
.switch[open] .chev{transform:rotate(-135deg) translateY(-1px)}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:280px;max-width:90vw;background:#fff;color:#0D1D18;border:1px solid #CFD9D2;border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:6px;z-index:60}
:root[data-theme="dark"] .menu{background:#1C1F23;color:#ECEEF1;border-color:#3D434A}
.mi{display:flex;align-items:center;border-radius:7px}
.mi a{flex:1;display:flex;flex-direction:column;padding:8px 10px;color:inherit;text-decoration:none;font-weight:700;font-size:14px}
.mi a small{font-weight:500;opacity:.6;font-size:12px}
.mi:hover,.mi.new:hover{background:rgba(127,140,133,.14)}
.mi.on a::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#6FA800;margin-right:6px;vertical-align:2px}
.mi .x{border:0;background:none;color:inherit;opacity:.5;font-size:20px;line-height:1;padding:6px 10px;cursor:pointer;border-radius:6px}
.mi .x:hover{opacity:1;background:rgba(196,37,54,.12);color:#C42536}
button.mi.theme{width:100%;border:0;background:none;color:inherit;text-align:left;padding:9px 10px;font-weight:700;font-size:14px;cursor:pointer;border-radius:7px}
a.mi.new{display:block;padding:9px 10px;margin-top:4px;border-top:1px solid rgba(127,140,133,.25);color:inherit;text-decoration:none;font-weight:800;font-size:14px;border-radius:0 0 7px 7px}

/* buttons, fields, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--ledger);cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.go:hover{filter:brightness(1.07)}
.btn.warn{border-color:var(--red);color:var(--red);background:transparent}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.ghost.go{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.link{background:none;border:0;padding:0;min-height:0;color:var(--ink);font-weight:700;text-align:left}
.btn.link:hover{color:var(--pos);text-decoration:underline}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:grid;gap:5px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
input[type=text],input[type=search],input[type=number],input[type=password],select{min-height:40px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--field);padding:7px 11px;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--lime-soft)}
/* Selects are ours, not the browser's: a pill with a drawn chevron, filled once a filter is set. */
select{appearance:none;-webkit-appearance:none;cursor:pointer;font-weight:600;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.tools select{border-radius:999px;min-height:34px;padding-top:4px;padding-bottom:4px;font-size:13px}
.tools select.set{background-color:var(--lime-soft);border-color:var(--accent);color:var(--ink);font-weight:800}
select.brand-sel{font-size:18px;font-weight:900;font-style:italic;font-variation-settings:"wdth" 70;border-radius:999px;min-height:42px;width:auto;max-width:100%;padding-left:16px}
input[type=checkbox]{accent-color:#6FA800;width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;justify-self:start}
.seg button{border:0;background:var(--field);padding:7px 14px;cursor:pointer;font-weight:700;min-height:38px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--office)}
.seg{flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--ledger-2);color:var(--muted);white-space:nowrap;vertical-align:1px}
.tag.t1{background:var(--gold-soft);color:var(--gold)} .tag.t2{background:var(--orange-soft);color:var(--orange)} .tag.t3{background:var(--red-soft);color:var(--red)}
.tag.bot{background:transparent;border:1px dashed var(--line-2)} .tag.you{background:var(--lime);color:var(--lime-ink)}
.tag.w{background:var(--lime-soft);color:var(--pos)} .tag.l{background:var(--red-soft);color:var(--red)}
.tag.ct{background:transparent;border:1px solid var(--line-2);color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:none}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--gold-soft);color:var(--gold)}
.ok{color:var(--pos)} .bad{color:var(--red)} .warn-t{color:var(--gold)}

/* layout */
.page{padding-top:22px;padding-bottom:60px;display:grid;gap:18px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(32px,5vw,52px)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--office);border:1px solid var(--line);border-radius:10px;padding:16px}
.card>h2,.card>h3{margin:0 0 10px;font-size:18px;font-weight:800}
.card h2.disp{font-size:26px}
.stack{display:grid;gap:12px}
.banner{background:linear-gradient(90deg,var(--ledger),var(--office));border:1px solid var(--line-2);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner.gold{border-left-color:var(--gold)}
.banner.red{border-left-color:var(--red);background:var(--red-soft)}
.banner .disp{font-size:24px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--office)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;padding:7px 9px;background:var(--ledger);white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;z-index:1}
table.t td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
table.t tbody tr:hover td{background:var(--ledger)}
table.t.dense td{padding:3px 8px;font-size:13px;white-space:nowrap}
table.t.dense th{padding:5px 8px}
table.t.dense .sal{font-size:15px}
table.t.dense .btn.sm{min-height:26px;padding:1px 9px;font-size:12px}
table.t.dense td.nm{max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.t .r{text-align:right}
table.t tr.me td{background:var(--lime-soft)}
table.t tr.dim td{opacity:.42}
table.t tr.cut td{border-bottom:2px solid var(--accent)}
.pn{font-weight:700;line-height:1.2;font-variation-settings:"wdth" 88}
.ps{font-size:12px;color:var(--muted)}
.sal{font-weight:900;font-style:italic;font-variation-settings:"wdth" 68;font-size:17px;white-space:nowrap}
.why{font-size:12px;color:var(--red)}
.empty{color:var(--muted);padding:10px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1;min-width:180px;width:auto}
.tools select{width:auto}
select.slot{min-height:32px;padding:3px 8px;font-size:13px;width:auto;max-width:100%;margin-top:4px}
.teampick{display:flex;gap:6px;flex-wrap:wrap}
.split>aside .picks li{padding:4px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:baseline}
.list li:first-child{border-top:0}
.list time{color:var(--dim);font-size:12px;min-width:92px}

/* the cap bar */
.capbar{display:grid;gap:6px}
.capbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.capbar-top .big{font-size:30px}
.track{position:relative;height:46px;background:var(--ledger);border:1px solid var(--line);border-radius:4px}
.blocks{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:3px}
.blk{height:100%;border-right:2px solid var(--office);background:var(--lime);color:var(--lime-ink);font-size:12px;font-weight:800;font-variation-settings:"wdth" 66;padding:4px 5px;overflow:hidden;white-space:nowrap;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between}
.blk:nth-child(even){background:#A9DC35}
:root:not([data-theme="dark"]) .blk{box-shadow:inset 0 0 0 1px rgba(13,29,24,.18)}
.blk span{opacity:.75;font-weight:700}
.blk.ghost{background:#FFE3A3;color:#3A2400;box-shadow:inset 0 0 0 2px #B87A00}
.blk.ghost.bad{background:#FFC9CF;color:#4A0010;box-shadow:inset 0 0 0 2px #C42536}
.blk.hold{background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(159,179,168,.35) 5px 7px);color:var(--muted)}
.tick{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--dim)}
.tick.on{border-left:3px solid var(--red);top:-8px;bottom:-8px}
.tick label{position:absolute;top:100%;transform:translateX(-50%);margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:700}
.tick.on label{color:var(--red)}
.capbar-foot{height:17px}
.capbar.compact{gap:3px}
.capbar.compact .capbar-top .big{font-size:20px}
.capbar.compact .capbar-top{font-size:13px}
.capbar.compact .track{height:24px}
.capbar.compact .blk{font-size:10.5px;padding:2px 4px;flex-direction:row;gap:4px;align-items:center;justify-content:flex-start}
.capbar.compact .tick label{display:none}
.capbar.compact .capbar-foot{height:2px}
.capbar.mini .track{height:10px}
.capbar.mini .blk{font-size:0;padding:0;border-right-width:1px}
.capbar.mini .tick{top:-3px;bottom:-3px}
.capbar.mini .tick label,.capbar.mini .capbar-foot{display:none}

/* landing */
.hero{padding:28px 0 16px}
.hero h1{margin:0;font-size:clamp(44px,7.5vw,92px)}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--pos)}
.hero p{max-width:62ch;color:var(--muted);font-size:17px;margin:16px 0 0}
.hero .capbar{margin-top:28px;max-width:920px}
.hero .blk{animation:stack .45s cubic-bezier(.2,.8,.2,1) both}
.hero .blk:nth-child(2){animation-delay:.06s}.hero .blk:nth-child(3){animation-delay:.12s}.hero .blk:nth-child(4){animation-delay:.18s}.hero .blk:nth-child(5){animation-delay:.24s}.hero .blk:nth-child(6){animation-delay:.3s}
@keyframes stack{from{transform:translateY(100%);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero .blk{animation:none}}
.landing{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:18px;padding:8px 0 18px;align-items:start}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.rules.grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:4px 28px}
.rules.grid li{grid-template-columns:120px 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
.rules-mod{margin-bottom:60px}
.rules-mod .head{margin-bottom:6px}
.rules-mod h2{font-size:34px;margin:0}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.wk{padding:10px 12px}
.wk.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.wk .list li{padding:4px 0;font-size:13px}
.list li.me{font-weight:800}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;margin-left:4px;vertical-align:2px}
.subtabs a[aria-current="page"] .badge{background:var(--red)}
.mymatch{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:16px;align-items:center;text-decoration:none;color:var(--ink);border-left:4px solid var(--accent)}
.mymatch:hover{border-color:var(--accent)}
.mm-l{display:grid;gap:2px}.mm-l b{font-size:26px}
.mm-s{font-size:52px;text-align:center}
.mm-c{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.mc{font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px;background:var(--ledger);color:var(--muted)}
.mc.w{background:var(--lime-soft);color:var(--pos)} .mc.l{background:var(--red-soft);color:var(--red)}
/* inside a league the site bar steps aside, so there's one dark band, not two */
body.inleague .ds-bar{display:none}
.rules li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.rules b{font-weight:900;font-style:italic;font-variation-settings:"wdth" 70;font-size:18px;line-height:1.1}
.rules span{color:var(--muted);font-size:14px}

/* matchups */
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.versus .b{text-align:right}
.versus .nm{font-size:26px}
.versus .score{font-size:64px;text-align:center;font-variant-numeric:tabular-nums}
.versus .score small{display:block;font:700 11px/1.4 var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-style:normal}
.cats{display:grid;grid-template-columns:repeat(var(--nc,9),minmax(0,1fr));gap:4px;margin-top:16px}
.cat{background:var(--ledger);border-radius:6px;padding:8px 4px;text-align:center;display:grid;gap:2px}
.cat .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.15}
.cat .v.w{color:var(--pos)} .cat .v.l{color:var(--dim)}
.cat.wa{box-shadow:inset 0 3px 0 var(--accent)} .cat.wb{box-shadow:inset 0 -3px 0 var(--dim)}
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.game{background:var(--office);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px;cursor:pointer;text-align:left;color:var(--ink)}
.game:hover,.game.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.game .ln{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.game .ln.trail{color:var(--muted);font-weight:600}

/* draft room: one screen, no page scroll */
body.room{overflow:hidden}
.room-shell{display:flex;flex-direction:column;height:calc(100dvh - var(--top,150px))}
.clock{border-bottom:1px solid var(--line)}
.clock .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.clock .on{font-size:24px}
.clock .on.me{color:var(--pos)}
.timer{font-size:34px;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right}
.timer.hot{color:var(--red)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-top:8px;padding-bottom:10px}
.pane .table-wrap{flex:1;min-height:0}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.split>*{min-height:0;display:flex;flex-direction:column;gap:10px}
.board{flex:1;min-height:0;overflow:auto}
.bgrid{display:grid;gap:3px;height:100%;min-width:calc(var(--n) * 74px + 34px)}
.bgrid .h{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-align:center;align-self:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.bgrid .h.me{color:var(--pos)}
.bgrid .rn{font-size:11px;color:var(--dim);font-weight:800;display:flex;align-items:center;justify-content:center}
.cell{background:var(--office);border:1px solid var(--line);border-radius:4px;padding:3px 5px;min-height:0;overflow:hidden;line-height:1.15;font-size:12px;display:flex;flex-direction:column;justify-content:center}
.cell b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variation-settings:"wdth" 75}
.cell small{color:var(--muted);font-size:11px}
.cell.f{background:var(--ledger)}
.cell.me{border-color:var(--accent);border-width:2px}
.cell.me.f{background:var(--lime-soft)}
.cell.now{background:var(--gold-soft);border-color:var(--gold)}
.cell.skip{opacity:.5}
.picks{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.picks li{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:7px 4px;border-top:1px solid var(--line);align-items:center;font-size:14px}
.picks li.me{background:var(--lime-soft)}
.picks .no{font-weight:900;font-style:italic;color:var(--muted)}

/* toasts and dialogs */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--court);padding:10px 16px;border-radius:8px;font-weight:700;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.bad{background:var(--red);color:#2A0006}
dialog{border:1px solid var(--line-2);border-radius:12px;background:var(--office);color:var(--ink);padding:20px;max-width:480px;width:calc(100% - 32px);max-height:88dvh}
dialog::backdrop{background:rgba(3,8,7,.72)}
dialog h3{margin:0 0 6px;font-size:24px;padding-right:36px}
dialog{position:fixed}
.dlg-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--ledger);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.dlg-x:hover{border-color:var(--muted)}
/* sortable headers */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
th.sortable.on::after{content:"";display:inline-block;margin-left:4px;border:4px solid transparent;border-top-color:currentColor;vertical-align:-2px}
th.sortable.on[aria-sort="ascending"]::after{border-top-color:transparent;border-bottom-color:currentColor;vertical-align:2px}
/* Draft Room: edge to edge */
body.room .wrap{max-width:none}
#pool tr[data-pid]{cursor:pointer}
.capline{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;background:var(--office);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px}
.capline b{font-size:16px}
.bgrid .h{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;padding-bottom:2px;min-height:44px;overflow:visible;position:sticky;top:0;background:var(--court);z-index:1}
.bgrid{height:auto;min-height:100%}
.bgrid .h b{font-size:12px;color:var(--ink)} .bgrid .h.me b{color:var(--pos)}
.bgrid .h small{font-weight:700;letter-spacing:0;color:var(--muted)}
.cell[data-player]{cursor:pointer}
.cell[data-player]:hover{border-color:var(--accent)}
.cell .sal{font-size:12px;font-style:italic;font-weight:900}
.cell i{font-style:normal;font-size:10px;font-weight:800;color:var(--dim);margin-left:2px}
table.t tr.target td{background:var(--lime-soft)}
table.t tr.bench td{color:var(--muted)} table.t tr.bench .pn{color:var(--muted)}
/* live prospect auction */
.auction{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.lot{display:grid;grid-template-columns:minmax(0,1.6fr) auto auto minmax(0,1.4fr);gap:18px;align-items:center;border-left:4px solid var(--accent)}
.lot-p{display:grid;gap:2px}.lot-p b{font-size:30px}
.lot-b{display:grid;justify-items:center}.lot-b b{font-size:46px;line-height:1}
.lot-t .timer{font-size:46px}
.auction-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.auction-main{min-height:0;display:flex;flex-direction:column}.auction-main .table-wrap{flex:1;min-height:0}
.auction-body>aside{min-height:0;overflow:auto}
.timer.hot{color:var(--red)}
@media (max-width:980px){.lot{grid-template-columns:1fr auto}.lot-a{grid-column:1/-1}.auction-body{grid-template-columns:1fr}.auction-body>aside{display:none}}
/* prospect movement */
.mv{display:inline-block;font-size:11.5px;font-weight:800;min-width:26px;text-align:right;color:var(--dim)}
.mv.up{color:var(--pos)} .mv.dn{color:var(--red)} .mv.new{color:var(--gold)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.loading{padding:80px 0;color:var(--muted)}
.ftoggle{display:none}
.hide-wide{display:none}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
.foot{color:var(--dim);font-size:12px;padding:22px 0 40px}

@media (max-width:980px){
  .cols,.cols2,.landing{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .split>aside{display:none}
  .hide-m{display:none}
}
@media (max-width:700px){
  .ftoggle{display:inline-flex}
  .fbox:not(.open) .fbody{display:none}
  .hide-wide{display:inline-flex}
  .mast .lg{display:block}
  .mast-top{min-height:48px;gap:8px}
  .brand b{font-size:20px}
  .brand img{width:28px;height:28px}
  .who{gap:6px;flex-wrap:wrap}
  .who .chip{display:none}
  .tabs a{padding:9px 11px 7px;font-size:13.5px}
  .switch summary{max-width:44vw;padding:5px 10px;font-size:13px}
  .capline{font-size:12.5px;gap:2px 12px;padding:5px 10px}
  .capline .ps,.capline .btn{display:none}
  .capline b{font-size:14px}
  .who [data-act=theme]{display:none}
  .mast-top{flex-wrap:nowrap}
  .clock .wrap{flex-wrap:nowrap}
  .clock .on{font-size:19px}
  .head h1{font-size:30px}
  .page{padding-top:14px;gap:14px}
  .card{padding:12px}
  .btn.sm{min-height:36px}
  input[type=text],input[type=search],input[type=number],input[type=password],select{font-size:16px}
  .capbar-top .big{font-size:24px}
  .track{height:38px}
  .clock .wrap{gap:8px}
  .rules.grid{grid-template-columns:1fr}
  .mymatch{grid-template-columns:1fr auto}.mm-c{grid-column:1/-1;justify-content:flex-start}.mm-s{font-size:40px}
  dialog{padding:16px;max-height:92dvh;overflow:auto}
}
@media (max-width:440px){.brand b{display:none}}
@media (max-width:600px){
  .row2{grid-template-columns:1fr}
  .rules li{grid-template-columns:1fr;gap:2px}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .versus .score{font-size:44px}
  .versus .nm{font-size:19px}
  table.t td,table.t th{padding:7px 6px}
  .hide-s{display:none}
  table.stand td{white-space:nowrap}
  table.stand td .ps,table.stand td .tag{display:none}
  table.stand td:nth-child(2){max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .timer{font-size:30px}
  .clock .on{font-size:22px}
  .tick label{display:none}
  .tick.on label{display:block;transform:translateX(-100%)}
}
</style>
