<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hard Cap | David Solar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hard Cap fantasy basketball: draft the player, carry the contract. Real NBA salaries, one hard line, a Prospect Board and nine-category weeks scored from real box scores.">
<meta name="theme-color" content="#0D1D18">
<script>try{var t=localStorage.getItem("hc:theme");if(t==="dark"||t==='"dark"')document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hard Cap">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&family=Besley:wght@700&family=Libre+Franklin:wght@500&display=swap">
<link rel="stylesheet" href="../assets/bar.css">
<link rel="stylesheet" href="../fantasy-kit/kit.css">
<script src="../assets/analytics.js" defer></script>
<style>
/* Hard Cap on the Fantasy Kit (../fantasy-kit/kit.css): the kit draws the shell, tables, cards, buttons, the
   matchup hero, feeds, trade cards and the draft room; this sheet sets Hard Cap's brand and the pieces only Hard
   Cap has. The brand: a front office at night, deep court green with Cap Lime for value and room under the line.
   Display type is Archivo at its heaviest, condensed and italic. The cap bar is the signature. */
:root{
  --band:#10201A; --brand:#C9FF4A; --brand-ink:#0A1A06; --accent:#2C7A0B; --brand-soft:rgba(150,210,30,.22);
  --disp-style:italic; --disp-wdth:64;
  --court:var(--bg); --office:var(--surface); --ledger:var(--surface-2); --ledger-2:var(--surface-3);
  --pos:var(--win); --red:var(--loss); --red-soft:var(--loss-soft); --lime:#C9FF4A; --lime-ink:#0A1A06; --lime-soft:var(--brand-soft);
  --orange:#B5521B; --orange-soft:#FDE7DA;
}
:root[data-theme="dark"]{ --accent:#C9FF4A; --brand-soft:rgba(150,214,80,.14); --orange:#F59A6E; --orange-soft:rgba(245,154,110,.16); }
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.loading{padding:80px 0;color:var(--muted)}
.foot{color:var(--dim);font-size:12px;padding:22px 0 40px}
body.inleague .ds-bar{display:none}
/* the league menu: the kit's switcher with Hard Cap's forget buttons */
.mi{display:flex;align-items:center;border-radius:8px}
.mi a{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 10px}
.mi a small{font-weight:500;opacity:.6;font-size:12px}
.mi.on a::before{content:none}
.mi .x{border:0;background:none;color:inherit;opacity:.5;font-size:20px;line-height:1;padding:6px 10px;cursor:pointer;border-radius:6px;width:auto}
.mi .x:hover{opacity:1;background:rgba(196,37,54,.12);color:#C42536}
a.mi.new{font-weight:800}
.fk-mast .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#F2F5F8}
.fk-mast .chip b{color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
/* tags Hard Cap adds: spending tiers, contract types */
.tag.t1{background:var(--gold-soft);color:var(--gold)} .tag.t2{background:var(--orange-soft);color:var(--orange)} .tag.t3{background:var(--loss-soft);color:var(--loss)}
.tag.w{background:var(--brand-soft);color:var(--win)} .tag.l{background:var(--loss-soft);color:var(--loss)}
.tag.ct{background:transparent;border:1px solid var(--line-2);color:var(--muted);font-weight:700;letter-spacing:.02em}
.pill{background:var(--gold-soft);color:var(--gold);font-size:11px;padding:1px 7px}
.pn{font-weight:700;line-height:1.2;font-variation-settings:"wdth" 88}
.btn.link.pn{font-weight:700}
.sal{font-weight:900;font-style:italic;font-variation-settings:"wdth" 68;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:baseline}
.list li:first-child{border-top:0}
.list time{color:var(--dim);font-size:12px;min-width:92px}
.list li.me{font-weight:800}
.card>h3,.card>h2{margin:0 0 10px;font-size:16px;font-weight:800}
.card:not(:has(>.mod-h)):not(:has(>.versus)):not(.flush){padding:16px}
.card h2.disp{font-size:26px}
.head .disp{font-size:clamp(30px,4.4vw,46px)}
.banner .disp{font-size:24px}
.banner.gold{border-left-color:var(--gold)} .banner.red{border-left-color:var(--loss);background:var(--loss-soft)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{flex-wrap:wrap}
.seg button{min-height:36px;padding:6px 14px}
select.brand-sel{font-size:18px;font-weight:900;font-style:italic;font-variation-settings:"wdth" 70;border-radius:999px;min-height:42px;width:auto;max-width:100%;padding-left:16px}
.teampick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ftoggle{display:none}
table.t tr.cut td{border-bottom:2px dashed var(--line-2)}
table.t tr.target td{background:var(--brand-soft)}
table.t tr.bench td{color:var(--muted)}
#pool tr[data-pid]{cursor:pointer}
.capline{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px}
.capline b{font-size:16px}
.mv{display:inline-block;font-size:11.5px;font-weight:800;min-width:26px;text-align:right;color:var(--dim)}
.mv.up{color:var(--win)} .mv.dn{color:var(--loss)} .mv.new{color:var(--gold)}

/* the cap bar */
.capbar{display:grid;gap:6px}
.capbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.capbar-top .big{font-size:30px}
.track{position:relative;height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px}
.blocks{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:3px}
.blk{height:100%;border-right:2px solid var(--surface);background:var(--lime);color:var(--lime-ink);font-size:12px;font-weight:800;font-variation-settings:"wdth" 66;padding:4px 5px;overflow:hidden;white-space:nowrap;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between}
.blk:nth-child(even){background:#A9DC35}
:root:not([data-theme="dark"]) .blk{box-shadow:inset 0 0 0 1px rgba(13,29,24,.18)}
.blk span{opacity:.75;font-weight:700}
.blk.ghost{background:#FFE3A3;color:#3A2400;box-shadow:inset 0 0 0 2px #B87A00}
.blk.ghost.bad{background:#FFC9CF;color:#4A0010;box-shadow:inset 0 0 0 2px #C42536}
.blk.hold{background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(159,179,168,.35) 5px 7px);color:var(--muted)}
.tick{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--dim)}
.tick.on{border-left:3px solid var(--loss);top:-8px;bottom:-8px}
.tick label{position:absolute;top:100%;transform:translateX(-50%);margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:700}
.tick.on label{color:var(--loss)}
.capbar-foot{height:17px}
.capbar.compact{gap:3px}
.capbar.compact .capbar-top .big{font-size:20px}
.capbar.compact .capbar-top{font-size:13px}
.capbar.compact .track{height:24px}
.capbar.compact .blk{font-size:10.5px;padding:2px 4px;flex-direction:row;gap:4px;align-items:center;justify-content:flex-start}
.capbar.compact .tick label{display:none}
.capbar.compact .capbar-foot{height:2px}
.capbar.mini .track{height:10px}
.capbar.mini .blk{font-size:0;padding:0;border-right-width:1px}
.capbar.mini .tick{top:-3px;bottom:-3px}
.capbar.mini .tick label,.capbar.mini .capbar-foot{display:none}

/* landing */
.hero{padding:28px 0 16px}
.hero h1{margin:0;font-size:clamp(44px,7.5vw,92px)}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--accent)}
.hero p{max-width:62ch;color:var(--muted);font-size:17px;margin:16px 0 0}
.hero .capbar{margin-top:28px;max-width:920px}
.hero .blk{animation:stack .45s cubic-bezier(.2,.8,.2,1) both}
.hero .blk:nth-child(2){animation-delay:.06s}.hero .blk:nth-child(3){animation-delay:.12s}.hero .blk:nth-child(4){animation-delay:.18s}.hero .blk:nth-child(5){animation-delay:.24s}.hero .blk:nth-child(6){animation-delay:.3s}
@keyframes stack{from{transform:translateY(100%);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero .blk{animation:none}}
.landing{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:18px;padding:8px 0 18px;align-items:start}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.rules.grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:4px 28px}
.rules.grid li{grid-template-columns:120px 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
.rules-mod{margin-bottom:60px}
.rules-mod .head{margin-bottom:6px}
.rules-mod h2{font-size:34px;margin:0}
.rules li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.rules b{font-weight:900;font-style:italic;font-variation-settings:"wdth" 70;font-size:18px;line-height:1.1}
.rules span{color:var(--muted);font-size:14px}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wk{padding:10px 12px}
.wk.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.wk .list li{padding:5px 0;font-size:13px;align-items:center}

/* message board */
.board-card{display:flex;flex-direction:column;gap:10px;max-width:860px}
.chat{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.chat .day{align-self:center;font-size:11px;font-weight:800;color:var(--dim);padding:6px 0 2px}
.msg{max-width:78%;background:var(--surface-2);border-radius:12px 12px 12px 4px;padding:7px 11px}
.msg.mine{align-self:flex-end;background:var(--brand-soft);border-radius:12px 12px 4px 12px}
.msg.cm{border:1px solid var(--gold)}
.msg .who{font-size:12px;font-weight:800;color:var(--muted)} .msg time{font-weight:500;color:var(--dim);margin-left:4px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.chat-form{display:flex;gap:8px;align-items:flex-end}
.chat-form textarea{flex:1;min-height:44px}

/* the Prospect Board auction keeps its own room inside the league pages */
body.room{overflow:hidden}
body.room .wrap{max-width:none}
.room-shell{display:flex;flex-direction:column;height:calc(100dvh - var(--top,150px))}
.clock{border-bottom:1px solid var(--line);background:var(--band);color:#F2F5F8;--muted:#B6C2D0}
.clock .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.clock .on{font-size:24px}
.clock .on.me{color:var(--brand)}
.timer{font-size:34px;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right}
.timer.hot{color:var(--loss)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-top:8px;padding-bottom:10px}
.pane .table-wrap{flex:1;min-height:0}
.auction{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.auction .lot{display:grid;grid-template-columns:minmax(0,1.6fr) auto auto minmax(0,1.4fr);gap:18px;align-items:center;border-left:4px solid var(--accent);padding:14px 16px;background:var(--surface);border-bottom:0}
.lot-p{display:grid;gap:2px}.lot-p b{font-size:30px}
.lot-b{display:grid;justify-items:center}.lot-b b{font-size:46px;line-height:1}
.lot-t .timer{font-size:46px}
.lot-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.auction-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.auction-main{min-height:0;display:flex;flex-direction:column}.auction-main .table-wrap{flex:1;min-height:0}
.auction-body>aside{min-height:0;overflow:auto}
/* the draft room (kit .droom) extras: Hard Cap's cap line and salary on each pick */
.droom .capline{margin:0 0 2px;background:var(--surface-2)}
.droom .tk b+small{font-variant-numeric:tabular-nums}
.rslots .sal{font-size:14px}

@media (max-width:980px){
  .landing{grid-template-columns:1fr}
  .auction .lot{grid-template-columns:1fr auto}.lot-a{grid-column:1/-1}.auction-body{grid-template-columns:1fr}.auction-body>aside{display:none}
}
@media (max-width:700px){
  .ftoggle{display:inline-flex}
  .fbox:not(.open) .fbody{display:none}
  .capline{font-size:12.5px;gap:2px 12px;padding:5px 10px}
  .capline .ps,.capline .btn{display:none}
  .capline b{font-size:14px}
  .head h1{font-size:30px}
  .capbar-top .big{font-size:24px}
  .track{height:38px}
  .rules.grid{grid-template-columns:1fr}
  .fk-who .chip{display:none}
  .fk-who [data-act=theme]{display:none}
}
@media (max-width:600px){
  .row2{grid-template-columns:1fr}
  .rules li{grid-template-columns:1fr;gap:2px}
  table.stand td{white-space:nowrap}
  table.stand td .ps,table.stand td .tag{display:none}
  .tick label{display:none}
  .tick.on label{display:block;transform:translateX(-100%)}
}
</style>
</head>
