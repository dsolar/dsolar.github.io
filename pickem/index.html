<style>
/* The Number: a sportsbook parlay card. Green card stock, black condensed type, red ink for the lines, and a pick that
   fills its box like a marked card. */
:root{
  --stock:#E4ECDF; --stock-2:#D6E1CF; --card:#FFFFFF; --ink:#111416; --ink-2:#4B5550; --faint:#6E7872; --rule:#C3CFBC;
  --red:#C21E2E; --red-ink:#A3121F; --win:#1F6B3A; --loss:#A3121F; --push:#7A5A00; --mark:#111416; --mark-ink:#FFFFFF;
  --focus:#2457C5;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Barlow,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stock);color:var(--ink);font:400 16px/1.45 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* masthead: the card's printed top */
.mast{padding:26px 0 14px;border-bottom:3px solid var(--ink)}
.mast-row{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.mast h1{margin:0;font:800 clamp(3rem,13vw,5.2rem)/.82 var(--cond);letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--red)}
.mast p{margin:8px 0 0;font:600 1.05rem/1.3 var(--cond);letter-spacing:.02em;color:var(--ink-2)}
.rec{display:grid;justify-items:end;gap:2px;font-family:var(--cond)}
.rec b{font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rec small{font-size:.85rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}

/* tabs: Picks, Standings, Groups */
.tabs{display:flex;gap:0;margin:14px 0 0;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--card)}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;font:700 1.05rem var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}

/* the week strip */
.week{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.week h2{margin:0;flex:1;font:800 1.7rem/1 var(--cond);text-transform:uppercase;letter-spacing:.01em}
.week button{width:44px;height:44px;border:2px solid var(--ink);border-radius:4px;background:var(--card);font:800 1.3rem var(--cond);cursor:pointer}
.week button:disabled{opacity:.3;cursor:default}
.note{margin:0 0 14px;color:var(--ink-2);font-size:.95rem}
.note b{color:var(--ink)}

/* a game: two lines, away over home, each a pick */
.games{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:0 0 110px}
.game{background:var(--card);border:1px solid var(--rule);border-radius:6px;box-shadow:0 1px 0 var(--stock-2)}
.g-top{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;border-bottom:1px dashed var(--rule);font:600 .9rem var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.g-top .grow{flex:1}
.g-top .live{color:var(--red);font-weight:700}
.side{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 12px;border:0;background:transparent;text-align:left;cursor:pointer}
.side+.side{border-top:1px solid #EDF1EA}
.side:disabled{cursor:default}
.side img{width:34px;height:34px;object-fit:contain}
.side img.gone{visibility:hidden}
.side .tm{display:grid;line-height:1.1;min-width:0}
.side .tm b{overflow-wrap:anywhere}
.side .tm b{font:700 1.3rem var(--cond);letter-spacing:.01em}
.side .tm small{font-size:.8rem;color:var(--faint)}
.side .sc{font:800 1.5rem var(--cond);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:76px;height:42px;padding:0 10px;border:2px solid var(--ink);border-radius:4px;font:800 1.35rem var(--cond);color:var(--red-ink);font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
@media (hover:hover){.side:not(:disabled):not(.on):hover .box{background:var(--stock)}}
.side.on .box{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.side.on .box::before{content:"";width:9px;height:15px;margin-right:7px;border:solid currentColor;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.side.cov .tm b::after{content:"covered";margin-left:8px;padding:1px 5px;border-radius:3px;background:var(--stock);font:700 .7rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--win);vertical-align:3px}
.game.locked .side:not(.on) .box{color:var(--faint);border-color:var(--rule)}
.g-foot{display:flex;align-items:center;gap:10px;padding:6px 12px 9px;border-top:1px dashed var(--rule);font-size:.85rem;color:var(--ink-2)}
.g-foot .grow{flex:1}
.stamp{display:inline-block;padding:2px 9px;border:2px solid currentColor;border-radius:3px;font:800 .95rem var(--cond);letter-spacing:.1em;text-transform:uppercase;transform:rotate(-4deg)}
.stamp.w{color:var(--win)}.stamp.l{color:var(--loss)}.stamp.p{color:var(--push)}
.split{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.split i{display:block;width:70px;height:6px;border-radius:3px;background:var(--stock-2);overflow:hidden}
.split i b{display:block;height:100%;background:var(--ink-2)}

/* the bar along the bottom: picks made, saved */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--card);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar b{font:800 1.4rem var(--cond)}
.bar .grow{flex:1}
.bar small{opacity:.75}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:4px;background:var(--card);color:var(--ink);font:700 1.05rem var(--cond);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.go{background:var(--red);border-color:var(--red);color:#fff}
.bar .btn{border-color:var(--card);white-space:nowrap;flex:none}
.btn:disabled{opacity:.5;cursor:default}

/* standings */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 12px}
.seg button{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font:700 1rem var(--cond);letter-spacing:.03em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
table.st{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:24px}
table.st th{padding:9px 10px;background:var(--ink);color:var(--card);font:700 .85rem var(--cond);letter-spacing:.08em;text-transform:uppercase;text-align:left}
table.st td{padding:10px;border-top:1px solid #EDF1EA;font-variant-numeric:tabular-nums}
table.st .n{text-align:right;font:700 1.1rem var(--cond)}
table.st .rk{width:2.4em;font:800 1.15rem var(--cond);color:var(--ink-2)}
table.st tr.me td{background:#FFF6D6}
table.st td.nm{font-weight:600;overflow-wrap:anywhere}
.empty{padding:22px;border:2px dashed var(--rule);border-radius:6px;text-align:center;color:var(--ink-2);background:rgba(255,255,255,.5)}
.grid-wrap{overflow-x:auto;margin:0 0 24px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
table.gp{border-collapse:collapse;font-size:.9rem}
table.gp th,table.gp td{padding:7px 9px;border-top:1px solid #EDF1EA;white-space:nowrap;text-align:center}
table.gp th{font:700 .8rem var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
table.gp td:first-child,table.gp th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
table.gp .w{color:var(--win);font-weight:700}.gp .l{color:var(--loss)}.gp .p{color:var(--push)}

/* groups */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px;margin:0 0 14px}
.panel h3{margin:0 0 4px;font:800 1.35rem var(--cond);text-transform:uppercase;letter-spacing:.02em}
.panel p{margin:0 0 12px;color:var(--ink-2);font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 200px;min-height:44px;padding:8px 12px;border:2px solid var(--ink);border-radius:4px;font:500 16px var(--body);background:#fff}
.grp{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EDF1EA}
.grp:first-of-type{border-top:0}
.grp .grow{flex:1;min-width:0}
.grp b{display:block;font:700 1.2rem var(--cond)}
.grp small{color:var(--ink-2)}
.code{font:800 1.1rem var(--cond);letter-spacing:.14em;padding:2px 8px;border:1px dashed var(--ink-2);border-radius:3px}
.link{padding:0;border:0;background:none;color:var(--red-ink);font:600 .95rem var(--body);text-decoration:underline;cursor:pointer;min-height:32px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:4px;background:var(--ink);color:#fff;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--red)}
.how{margin:28px 0 120px;color:var(--ink-2);font-size:.95rem}
.how h3{margin:0 0 6px;font:800 1.2rem var(--cond);text-transform:uppercase;color:var(--ink)}
.how ul{margin:0;padding-left:1.1em}
.how li{margin:4px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  .side{grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;padding:8px 10px}
  .side.cov .tm b::after{display:block;width:max-content;margin:3px 0 0}
  .side img{width:30px;height:30px}
  .box{min-width:68px}
  .side .tm small{display:none}
  .rec b{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
