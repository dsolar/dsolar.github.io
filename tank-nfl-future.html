<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Tankathon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #d56e00;
      --text: #444;
      --bg: #fff;
      --hover-bg: #f5f5f5;
    }

    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 280px;
      width: 100%;
    }

    h1 {
      font-size: 6rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
      line-height: 1;
    }

    h2 {
      font-size: 1.5rem;
      margin: 10px 0 70px;
      font-weight: 600;
      color: #555;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.btn {
      display: block;
      padding: 14px;
      background: var(--hover-bg);
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    a.btn:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 40px;
      display: inline-block;
      text-decoration: none;
    }

    .logo span {
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="/" class="logo">Tankathon</a>

    <h1>404</h1>
    <h2>Page Not Found</h2>

    <div class="links">
      <a href="/" class="btn">NBA home page</a>
      <a href="/nfl" class="btn">NFL home page</a>
      <a href="/nhl" class="btn">NHL home page</a>
      <a href="/mlb" class="btn">MLB home page</a>
      <a href="/wnba" class="btn">WNBA home page</a>
    </div>
  </div>
</body>

</html>
