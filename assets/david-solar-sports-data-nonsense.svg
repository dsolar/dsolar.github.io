<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">David Solar — Sports. Data. Nonsense.</title>
  <desc id="desc">A stylized CITGO sign rises above Fenway's Green Monster, with a dotted sports-ball graph plotted across the wall.</desc>
  <g transform="translate(22 18)" stroke-linecap="round" stroke-linejoin="round">
    <!-- A restrained city roofline gives the sign a real skyline context. -->
    <path d="M18 168v-26h25v26m9 0v-39h26v39m11 0v-30h22v30m107 0v-36h28v36" fill="#D9E0DF" stroke="#18334C" stroke-width="2"/>
    <!-- CITGO sign and support poles, drawn in the proportions of the Kenmore Square landmark. -->
    <path d="M127 94v86m49-86v86" fill="none" stroke="#18334C" stroke-width="4"/>
    <rect x="113" y="23" width="72" height="75" rx="2" fill="#F8F5ED" stroke="#18334C" stroke-width="3"/>
    <path d="M149 31 173 59h-48z" fill="#C83E39"/>
    <text x="149" y="76" text-anchor="middle" fill="#18334C" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" letter-spacing=".5">CITGO</text>
    <path d="M121 86h56" stroke="#315E93" stroke-width="3"/>
    <path d="M121 91h56" stroke="#C83E39" stroke-width="2"/>
    <!-- The Green Monster with scoreboard details. -->
    <path d="M9 176q0-7 7-7h233q7 0 7 7v72H9z" fill="#176746" stroke="#18334C" stroke-width="4"/>
    <path d="M23 182h53v20H23z" fill="#103D31" stroke="#E7D7AF" stroke-width="1.5"/>
    <text x="49.5" y="196" text-anchor="middle" fill="#F8F5ED" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing="1.1">FENWAY</text>
    <path d="M87 181v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56m8-56v56" stroke="#B5D2BF" stroke-width="1" opacity=".3"/>
    <path d="M9 248h247" stroke="#18334C" stroke-width="5"/>
    <!-- A rising dotted graph on the wall; each plotted point is a different sport. -->
    <path d="M24 225c34-19 52-2 82-14s40-26 67-15 43 3 72-23" fill="none" stroke="#EFB75A" stroke-width="4" stroke-dasharray="2 9"/>
    <g transform="translate(25 224)"><circle r="10" fill="#F8F5ED" stroke="#C83E39" stroke-width="2.5"/><path d="M-4-7c4 4 4 10 0 14m8-14c-4 4-4 10 0 14" fill="none" stroke="#C83E39" stroke-width="1.4"/></g>
    <g transform="translate(105 210)"><circle r="10" fill="#C77732" stroke="#F8F5ED" stroke-width="1.5"/><path d="M-7-6c8 5 8 7 14 12M7-6C-1-1-1 1-7 6M0-9v18" fill="none" stroke="#F8F5ED" stroke-width="1.35"/></g>
    <g transform="translate(174 198) rotate(-22)"><ellipse rx="11" ry="7.5" fill="#F8F5ED" stroke="#18334C" stroke-width="2"/><path d="M-4-5v10m-3-7h6m-6 4h6" stroke="#C83E39" stroke-width="1.3"/></g>
    <g transform="translate(244 173)"><circle r="9" fill="#18334C" stroke="#F8F5ED" stroke-width="1.5"/><path d="M-4-5c4 3 4 7 0 10m8-10c-4 3-4 7 0 10" fill="none" stroke="#F8F5ED" stroke-width="1.2"/></g>
  </g>
  <path d="M310 42v211" stroke="#C83E39" stroke-width="3"/>
  <text x="350" y="130" fill="#18334C" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="800" letter-spacing="1.8">DAVID SOLAR</text>
  <text x="353" y="181" fill="#18334C" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="3.1">SPORTS. DATA. NONSENSE.</text>
  <path d="M353 207h330" stroke="#C83E39" stroke-width="4"/>
</svg>
