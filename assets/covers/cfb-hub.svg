<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780">
  <!-- CFB Hub cover: illustration only, so it never shows stale lines. Same system as the other hub covers. -->
  <rect width="1040" height="780" fill="#F5F4F0"/>
  <rect width="1040" height="12" fill="#C60C30"/>
  <g font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-weight="700">
    <!-- section pills -->
    <rect x="60" y="62" width="580" height="56" rx="28" fill="#fff" stroke="#D9DCE1" stroke-width="2"/>
    <rect x="70" y="70" width="140" height="40" rx="20" fill="#002244"/><text x="140" y="97" fill="#fff" font-size="19" text-anchor="middle">THIS WEEK</text>
    <text x="272" y="97" fill="#56637A" font-size="19" text-anchor="middle">PLAYOFF</text>
    <text x="392" y="97" fill="#56637A" font-size="19" text-anchor="middle">RATINGS</text>
    <text x="510" y="97" fill="#56637A" font-size="19" text-anchor="middle">HEISMAN</text>

    <!-- field -->
    <g transform="translate(60 160)">
      <rect width="600" height="300" rx="12" fill="#fff" stroke="#9AA5B4" stroke-width="4"/>
      <rect x="2" y="2" width="60" height="296" fill="#002244" opacity=".9"/>
      <rect x="538" y="2" width="60" height="296" fill="#C60C30" opacity=".85"/>
      <g stroke="#9AA5B4" stroke-width="2">
        <line x1="62" y1="2" x2="62" y2="298"/><line x1="109.6" y1="2" x2="109.6" y2="298"/><line x1="157.2" y1="2" x2="157.2" y2="298"/><line x1="204.8" y1="2" x2="204.8" y2="298"/><line x1="252.4" y1="2" x2="252.4" y2="298"/>
        <line x1="300" y1="2" x2="300" y2="298" stroke="#002244" stroke-width="3"/>
        <line x1="347.6" y1="2" x2="347.6" y2="298"/><line x1="395.2" y1="2" x2="395.2" y2="298"/><line x1="442.8" y1="2" x2="442.8" y2="298"/><line x1="490.4" y1="2" x2="490.4" y2="298"/><line x1="538" y1="2" x2="538" y2="298"/>
      </g>
      <g stroke="#C9CFD8" stroke-width="2"><path d="M80 110h8M80 190h8M128 110h8M128 190h8M176 110h8M176 190h8M224 110h8M224 190h8M272 110h8M272 190h8M320 110h8M320 190h8M368 110h8M368 190h8M416 110h8M416 190h8M464 110h8M464 190h8M512 110h8M512 190h8"/></g>
      <!-- a drive: line of scrimmage, first-down marker and the play -->
      <line x1="252.4" y1="2" x2="252.4" y2="298" stroke="#2F6FDB" stroke-width="4" opacity=".7"/>
      <line x1="300" y1="2" x2="300" y2="298" stroke="#E5B000" stroke-width="4" opacity=".8"/>
      <g fill="none" stroke="#002244" stroke-width="4" stroke-linecap="round"><path d="M240 150 C 300 150, 330 80, 420 70"/></g>
      <path d="M420 70l-14 -6l2 14z" fill="#002244"/>
      <g fill="#002244"><circle cx="240" cy="150" r="9"/><circle cx="228" cy="120" r="7"/><circle cx="228" cy="180" r="7"/></g>
      <g stroke="#C60C30" stroke-width="4" stroke-linecap="round"><path d="M276 132l12 12M288 132l-12 12"/><path d="M276 166l12 12M288 166l-12 12"/><path d="M350 96l12 12M362 96l-12 12"/></g>
    </g>

    <!-- Saturday's line card -->
    <g transform="translate(700 160)">
      <rect width="280" height="300" rx="12" fill="#fff" stroke="#D9DCE1" stroke-width="2"/>
      <text x="22" y="40" fill="#56637A" font-size="16" letter-spacing="2">HUB VS BOOK</text>
      <circle cx="40" cy="86" r="16" fill="#E3E7EC"/><rect x="66" y="78" width="96" height="16" rx="4" fill="#D9DCE1"/><text x="258" y="94" fill="#002244" font-size="24" text-anchor="end">68%</text>
      <circle cx="40" cy="134" r="16" fill="#E3E7EC"/><rect x="66" y="126" width="80" height="16" rx="4" fill="#D9DCE1"/><text x="258" y="142" fill="#002244" font-size="24" text-anchor="end">32%</text>
      <rect x="22" y="176" width="236" height="16" rx="8" fill="#C60C30"/><rect x="22" y="176" width="160" height="16" rx="8" fill="#002244"/>
      <rect x="22" y="214" width="112" height="64" rx="10" fill="#002244"/><text x="78" y="243" fill="#fff" font-size="15" text-anchor="middle">HUB</text><text x="78" y="266" fill="#fff" font-size="22" text-anchor="middle">−7.0</text>
      <rect x="146" y="214" width="112" height="64" rx="10" fill="#fff" stroke="#9AA5B4" stroke-width="2"/><text x="202" y="243" fill="#56637A" font-size="15" text-anchor="middle">BOOK</text><text x="202" y="266" fill="#002244" font-size="22" text-anchor="middle">−3.5</text>
    </g>

    <!-- 12-team bracket strip -->
    <g transform="translate(60 500)">
      <rect width="920" height="210" rx="12" fill="#fff" stroke="#D9DCE1" stroke-width="2"/>
      <text x="24" y="40" fill="#56637A" font-size="16" letter-spacing="2">PROJECTED BRACKET</text>
      <g fill="#E3E7EC">
        <rect x="24" y="62" width="180" height="28" rx="6"/><rect x="24" y="96" width="180" height="28" rx="6"/>
        <rect x="24" y="140" width="180" height="28" rx="6"/><rect x="24" y="174" width="180" height="0" rx="6"/>
        <rect x="260" y="62" width="180" height="28" rx="6"/><rect x="260" y="96" width="180" height="28" rx="6" fill="#F0F2F5"/>
        <rect x="260" y="140" width="180" height="28" rx="6"/><rect x="260" y="174" width="180" height="0" rx="6"/>
        <rect x="496" y="96" width="180" height="28" rx="6"/><rect x="496" y="140" width="180" height="28" rx="6" fill="#F0F2F5"/>
      </g>
      <g fill="#C60C30" font-size="18"><text x="36" y="83">8</text><text x="36" y="117">9</text><text x="36" y="161">5</text><text x="272" y="83">1</text><text x="272" y="161">4</text></g>
      <g fill="#D9DCE1"><rect x="56" y="70" width="110" height="12" rx="4"/><rect x="56" y="104" width="90" height="12" rx="4"/><rect x="56" y="148" width="120" height="12" rx="4"/><rect x="292" y="70" width="120" height="12" rx="4"/><rect x="292" y="148" width="100" height="12" rx="4"/><rect x="510" y="104" width="120" height="12" rx="4"/></g>
      <g fill="none" stroke="#9AA5B4" stroke-width="2"><path d="M204 93 H232 V110 H260"/><path d="M440 76 H468 V110 H496"/><path d="M440 154 H468 V140 H496"/><path d="M676 124 H712"/></g>
      <rect x="712" y="70" width="184" height="110" rx="10" fill="#002244"/>
      <text x="804" y="112" fill="#fff" font-size="16" text-anchor="middle" letter-spacing="2">CHAMPION</text>
      <text x="804" y="152" fill="#fff" font-size="32" text-anchor="middle">25%</text>
    </g>
  </g>
</svg>
