<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780">
  <!-- NBA Hub cover: illustration only, so it never shows stale projections. -->
  <rect width="1040" height="780" fill="#F5F4F0"/>
  <rect width="1040" height="12" fill="#C60C30"/>
  <g font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-weight="700">
    <!-- year slider -->
    <rect x="60" y="62" width="540" height="56" rx="28" fill="#fff" stroke="#D9DCE1" stroke-width="2"/>
    <text x="118" y="97" fill="#56637A" font-size="20" text-anchor="middle">2026-27</text>
    <text x="222" y="97" fill="#56637A" font-size="20" text-anchor="middle">2027-28</text>
    <rect x="276" y="70" width="104" height="40" rx="20" fill="#002244"/>
    <text x="328" y="97" fill="#F5F4F0" font-size="20" text-anchor="middle">2028-29</text>
    <text x="434" y="97" fill="#56637A" font-size="20" text-anchor="middle">2029-30</text>
    <text x="538" y="97" fill="#56637A" font-size="20" text-anchor="middle">2030-31</text>

    <!-- half court -->
    <rect x="60" y="150" width="600" height="440" rx="18" fill="#E7C590"/>
    <g fill="none" stroke="#fff" stroke-width="5" opacity=".9">
      <rect x="64" y="154" width="592" height="432" rx="14"/>
      <rect x="265" y="380" width="190" height="206" fill="#C9A06A"/>
      <circle cx="360" cy="380" r="70"/>
      <path d="M95 586 V512 A268 268 0 0 1 625 512 V586"/>
      <path d="M288 154 A72 72 0 0 0 432 154"/>
      <circle cx="360" cy="550" r="12"/>
      <line x1="322" y1="566" x2="398" y2="566"/>
    </g>
    <!-- starting five -->
    <g>
      <circle cx="360" cy="228" r="34" fill="#007A33" stroke="#fff" stroke-width="5"/>
      <circle cx="560" cy="300" r="34" fill="#007A33" stroke="#fff" stroke-width="5"/>
      <circle cx="160" cy="300" r="34" fill="#007A33" stroke="#fff" stroke-width="5"/>
      <circle cx="488" cy="470" r="34" fill="#007A33" stroke="#fff" stroke-width="5"/>
      <circle cx="238" cy="482" r="34" fill="#007A33" stroke="#fff" stroke-width="5"/>
      <rect x="320" y="270" width="80" height="24" rx="5" fill="#D8F0DC"/><text x="360" y="288" fill="#1E6B35" font-size="16" text-anchor="middle">PG +2.1</text>
      <rect x="520" y="342" width="80" height="24" rx="5" fill="#D9E8FB"/><text x="560" y="360" fill="#1D4E89" font-size="16" text-anchor="middle">SG +4.0</text>
      <rect x="120" y="342" width="80" height="24" rx="5" fill="#D8F0DC"/><text x="160" y="360" fill="#1E6B35" font-size="16" text-anchor="middle">SF +1.6</text>
      <rect x="448" y="512" width="80" height="24" rx="5" fill="#EEF0F3"/><text x="488" y="530" fill="#33415C" font-size="16" text-anchor="middle">PF +0.7</text>
      <rect x="198" y="524" width="80" height="24" rx="5" fill="#D8F0DC"/><text x="238" y="542" fill="#1E6B35" font-size="16" text-anchor="middle">C +2.3</text>
    </g>

    <!-- trade card -->
    <rect x="700" y="150" width="280" height="290" rx="16" fill="#fff" stroke="#D9DCE1" stroke-width="2"/>
    <rect x="700" y="150" width="280" height="8" rx="4" fill="#002244"/>
    <text x="724" y="196" fill="#0B1B30" font-size="24">TRADE WORKS</text>
    <rect x="724" y="214" width="232" height="40" rx="8" fill="#F1F3F6"/>
    <text x="738" y="240" fill="#56637A" font-size="18">OUT</text><text x="942" y="240" fill="#0B1B30" font-size="20" text-anchor="end">$30.3M</text>
    <rect x="724" y="262" width="232" height="40" rx="8" fill="#F1F3F6"/>
    <text x="738" y="288" fill="#56637A" font-size="18">IN</text><text x="942" y="288" fill="#0B1B30" font-size="20" text-anchor="end">$35.1M</text>
    <rect x="724" y="310" width="232" height="40" rx="8" fill="#F1F3F6"/>
    <text x="738" y="336" fill="#56637A" font-size="18">MAX BACK</text><text x="942" y="336" fill="#0B1B30" font-size="20" text-anchor="end">$39.7M</text>
    <rect x="724" y="370" width="116" height="40" rx="20" fill="#D8F0DC"/>
    <text x="782" y="396" fill="#1E6B35" font-size="18" text-anchor="middle">LEGAL</text>
    <rect x="850" y="370" width="106" height="40" rx="20" fill="#FBE3E1"/>
    <text x="903" y="396" fill="#A3271E" font-size="18" text-anchor="middle">TPE</text>

    <!-- lottery odds bars -->
    <rect x="700" y="466" width="280" height="248" rx="16" fill="#fff" stroke="#D9DCE1" stroke-width="2"/>
    <text x="724" y="508" fill="#0B1B30" font-size="22">LOTTERY ODDS</text>
    <rect x="724" y="528" width="200" height="18" rx="9" fill="#EEF0F3"/><rect x="724" y="528" width="150" height="18" rx="9" fill="#C60C30"/>
    <rect x="724" y="562" width="200" height="18" rx="9" fill="#EEF0F3"/><rect x="724" y="562" width="128" height="18" rx="9" fill="#C60C30"/>
    <rect x="724" y="596" width="200" height="18" rx="9" fill="#EEF0F3"/><rect x="724" y="596" width="112" height="18" rx="9" fill="#C60C30"/>
    <rect x="724" y="630" width="200" height="18" rx="9" fill="#EEF0F3"/><rect x="724" y="630" width="86" height="18" rx="9" fill="#C60C30" opacity=".75"/>
    <rect x="724" y="664" width="200" height="18" rx="9" fill="#EEF0F3"/><rect x="724" y="664" width="62" height="18" rx="9" fill="#C60C30" opacity=".55"/>

    <!-- surplus strip -->
    <rect x="60" y="620" width="600" height="94" rx="16" fill="#002244"/>
    <text x="88" y="660" fill="#9FB3CF" font-size="18">SURPLUS VALUE</text>
    <text x="88" y="694" fill="#fff" font-size="28">Value − Contract</text>
    <text x="632" y="690" fill="#7BD88F" font-size="40" text-anchor="end">+$90M</text>
  </g>
</svg>
